function lum(hex){const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)}

 if(dk){Object.assign(c,{bg:'#17181a',side:'#202124',card:'#25272a',text:'#e8eaed',soft:'#9aa0a6'});c.main=mixW(c.main,.35)}
 for(const k in c)r.setProperty('--'+k,c[k]);

 r.setProperty('--onmain',lum(c.main)>.42?'#202124':'#ffffff');r.setProperty('--onaccent',lum(c.accent)>.3?'#202124':'#ffffff');

const splitM=x=>{const a=String(x||'').split(/\s*[,;\/\n]\s*|\s+or\s+/i).map(v=>v.trim()).filter(Boolean);return a.length?a:['']};
const splitE=x=>{const a=String(x||'').split(/[,;\s]+/).map(v=>v.trim()).filter(Boolean);return a.length?a:['']};
const TT={upper:'uppercase',lower:'lowercase',title:'capitalize',asis:'none'};
function caseFmt(v,m){v=String(v==null?'':v).trim();if(m==='upper')return v.toUpperCase();if(m==='lower')return v.toLowerCase();if(m==='title')return v.toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,(x,a,b)=>a+b.toUpperCase());return v}

function checks(m,mode){const nw=mode==='new',hasRoom=m.rooms.some(r=>r.category.trim()&&Object.values(r.p||{}).some(v=>v)),dup=dupName(m,m.id);
 const req=[['Island chosen',!!m.island]];if(nw)req.push(['Class chosen',!!m.tier]);req.push([dup?'Hotel name already exists on this island':'Hotel name',!!m.name.trim()&&!dup]);if(nw)req.push(['Mobile number',m.mobiles.some(x=>x.trim())],['1 room category with a price',hasRoom]);

 return{req,opt}}
function validate(m,mode){const nw=mode==='new',E=[],add=(msg,f)=>E.push({msg,f});
 if(!m.island)add('Choose an island','island');
 if(nw&&!m.tier)add('Choose a class (High / Mid / Low)','tier');
 if(!m.name.trim())add('Type the hotel name','name');else if(dupName(m,m.id))add('A hotel named “'+m.name.trim().toUpperCase()+'” already exists on '+m.island+'. Change the name.','name');
 if(nw&&!m.mobiles.some(x=>x.trim()))add('Type at least one mobile number','mobiles.0');
 m.mobiles.forEach((v,i)=>{if(v.trim()&&!/\d{5}/.test(v))add('Mobile no '+(i+1)+' should have at least 5 digits','mobiles.'+i)});
 m.emails.forEach((v,i)=>{if(v.trim()&&!/^\S+@\S+\.\S+$/.test(v.trim()))add('Email '+(i+1)+' looks wrong — it should look like name@example.com','emails.'+i)});
 let any=false;const seen={};
 m.rooms.forEach((r,i)=>{const cat=r.category.trim().toUpperCase(),pr=Object.entries(r.p||{}).filter(([k,v])=>v!=null&&v!=='');
  if(!cat&&pr.length)add('Room row '+(i+1)+': type the room category (it has prices)','rooms.'+i+'.category');
  if(cat&&seen[cat])add('Room row '+(i+1)+': “'+cat+'” is already entered above. Use one row per category.','rooms.'+i+'.category');if(cat)seen[cat]=1;
  if(nw&&cat&&!pr.length)add('Room row '+(i+1)+' ('+cat+'): enter at least one price','rooms.'+i+'.p.'+(m.plansOn[0]||'CP'));
  pr.forEach(([k,v])=>{if(isNaN(+v)||+v<=0)add('Room row '+(i+1)+': the '+k+' price must be a number above 0','rooms.'+i+'.p.'+k)});
  if(cat&&pr.length)any=true});
 if(nw&&!any)add('Add at least one room category with a price','rooms.0.category');

 return ''}
PAGES.settings=()=>{const m=SMENU.map(([g,it])=>`<div class="lbl" style="margin:14px 0 6px 6px">${g}</div>`+it.map(([k,ic,n])=>`<button class="nav-s ${k===UI.sset?'on':''}" data-a="sset" data-k="${k}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;padding:9px 12px;border-radius:12px;font-size:.88rem;font-weight:${k===UI.sset?700:500};width:100%;${k===UI.sset?'background:var(--mainsoft);color:var(--main)':''}"><span style="width:20px;text-align:center">${S.set.emoji?ic:''}</span>${n}</button>`).join('')).join('');
 return pageHead('Settings','Change anything — colours, plan types, facilities, classes, islands','APPLIES TO ALL ISLANDS')+`<div class="grid" style="grid-template-columns:minmax(0,260px) minmax(0,1fr);align-items:start"><div class="card" style="padding:8px 12px 16px">${m}</div><div class="grid" style="align-content:start" id="sbody">${settingsBody()}</div></div>`};

/* ---------- shell ---------- */
const NAV=[['home','🏠','Dashboard'],['packages','🧳','Packages'],['hotels','🏨','All Hotels'],['detail','📄','Hotel Details'],['find','🔎','Find / Search'],['sep','Browse'],['range','₹','Price Range'],['star','★','Star Category'],['rank','🏆','Top Rankings'],['fac','🌊','Facility Lists'],['sep','Admin'],['classify','🏷️','Classify Hotels'],['new','➕','New Hotel Entry'],['update','🔄','Update All Hotels'],['company','ℹ️','Company Info'],['sep','System'],['settings','⚙️','Settings'],['pkgset','🧳','Package Settings']];
function render(){const y=window.scrollY,ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;
 const s=S.set,all=S.hotels;
 const nav=NAV.map(n=>n[0]==='sep'?`<div class="sep">${n[1]}</div>`:`<button class="${UI.page===n[0]?'on':''}" data-a="go" data-k="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('');
 const un=all.filter(h=>h.island===UI.island&&!h.tier).length;
 const cnt=c=>all.filter(h=>h.island===UI.island&&(c==='Unassigned'?!h.tier:h.tier===c)).length;
 const chips=['All',...s.classes.map(c=>c.name),'Unassigned'].map(c=>`<button class="cc ${UI.cls===c?'on':''}" data-a="cls" data-k="${esc(c)}">${esc(c)}${c==='All'?'':' '+cnt(c)}</button>`).join('');
 const bar=UI.page==='settings'||UI.page==='company'||UI.page==='pkgset'?'':`<div class="isl"><span class="t">ISLAND</span>${s.islands.map(i=>`<button class="tab ${i.name===UI.island?'on':''}" data-a="island" data-k="${esc(i.name)}">${esc(i.name)}${i.name!=='Port Blair'?' Island':''}<b>${all.filter(h=>h.island===i.name).length}</b></button>`).join('')}<span class="sp"></span><span class="t">CLASS</span>${chips}</div>`;
 let body;try{body=PAGES[UI.page]()}catch(e){body=`<div class="card"><h3>Something went wrong</h3><p class="mini">${esc(e.message)}</p></div>`;console.error(e)}
 $('#root').innerHTML=`<div class="mtop"><b>${esc(s.appName)}</b><button class="btn sm" data-a="navToggle">☰ Menu</button></div><div class="app"><aside class="side ${UI.navOpen?'open':''}"><div class="brand"><b>${s.logo?`<img class="sbl" src="${esc(s.logo)}" alt="">`:(s.emoji?'🏝️ ':'')}${esc(s.appName)}</b><small>${esc(s.appSub)}</small></div><nav class="nav">${nav}</nav></aside><main class="main">${bar}${body}</main></div>`;
 markErrs();window.scrollTo(0,y);if(fid){const e=document.getElementById(fid);if(e&&ae&&ae!==e&&ae.tagName===e.tagName&&ae.type===e.type){e.replaceWith(ae);ae.focus()}else if(e&&e.focus){e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(x){}}}}
function snap(){return{page:UI.page,island:UI.island,cls:UI.cls,sel:UI.sel}}
let rq=0;function renderSoon(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function go(p,noHist){if(p==='settings'&&S.set.pin&&!UI.unlocked){guard(()=>go('settings'));return}if(!noHist&&p!==UI.page){UI.hist.push(snap());if(UI.hist.length>50)UI.hist.shift()}UI.page=p;UI.edit=false;UI.errs=null;UI.navOpen=false;if(p!=='new'&&p!=='update'&&!UI.edit&&D&&!D.id&&p!=='new'&&p!=='update'){/* keep draft */}render();window.scrollTo(0,0)}

 open:(el,e)=>{e.preventDefault();UI.hist.push(snap());const h=S.hotels.find(x=>x.id===el.dataset.id);if(h){if(h.island!==UI.island){UI.island=h.island;UI.cls='All'}else if(!inScope(h))UI.cls='All';UI.sel=h.id}go('detail',true)},

function processImg(f,size,cb){if(!/^image\//.test(f.type)){toast('Please choose an image file');return}const r=new FileReader();r.onerror=()=>toast('Could not read that file');r.onload=()=>{const im=new Image();im.onerror=()=>toast('That image could not be opened');im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);cb(c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)}

 h.addons=d.addons.filter(a=>a.item.trim()).map(a=>({item:caseFmt(a.item,S.set.textCase.addon),rate:toNum(a.rate),note:''}))}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(!e.target.closest('.combo'))closeDD();
 const ov=e.target.closest('.ov');if(ov&&e.target===ov){closeModal();return}
 const t=e.target.closest('[data-a]');if(!t)return;const fn=A[t.dataset.a];if(fn){if(t.tagName==='A')e.preventDefault();fn(t,e)}});
function onField(e){const t=e.target;
 if(t.dataset.file){const f=t.files&&t.files[0];if(!f)return;if(t.dataset.file==='logo')processImg(f,256,u=>{S.set.logo=u;save();render();toast('Logo updated')});else{const i=+t.dataset.k;processImg(f,160,u=>{S.set.company.team[i].photo=u;save();render()})}t.value='';return}
 if(t.dataset.upk){UI.pkgDur=t.value;render();return}
 if(t.dataset.upr){UI.pr[t.dataset.upr]=t.value;render();return}
 if(t.dataset.aChange&&e.type==='change'){const fn=A[t.dataset.aChange];if(fn){fn(t,e);return}if(t.dataset.aChange==='selH'){UI.sel=t.value;render();return}}
 if(t.dataset.m&&D){const p=t.dataset.m;let v=t.dataset.n?toNum(t.value):t.value;pset(D,p,v);if(t.dataset.dd&&e.type==='input')ddFilter(t);
  if(t.dataset.re&&e.type==='change'){render();return}refreshStatus();return}
 if(t.dataset.col){S.set.colors[t.dataset.col]=t.value;const hx=t.parentElement.querySelector('.hexv');if(hx)hx.textContent=t.value.toUpperCase();applyTheme();save();return}
 if(t.dataset.s){let v=t.dataset.n?toNum(t.value):t.value;if(t.dataset.n&&v==null&&t.type==='range')return;pset(S.set,t.dataset.s,v);save();if(t.dataset.pk)updPkgTotal();applyTheme();if(t.dataset.re&&e.type==='change')render();return}
 if(t.dataset.uf){UI.f[t.dataset.uf]=t.value;if(e.type==='input'||t.tagName==='SELECT')renderSoon();return}
 if(t.dataset.u){const k=t.dataset.u,v=t.value;if(k==='sugLow')UI.sug.low=+v;else if(k==='sugMid')UI.sug.mid=+v;else UI[k]=v;if(k==='sugLow'||k==='sugMid')return;if(e.type==='input'||t.tagName==='SELECT')renderSoon();return}}
document.addEventListener('input',e=>{if(e.target.dataset.col||e.target.type==='range'||e.target.dataset.m||((e.target.dataset.u||e.target.dataset.uf)&&(e.target.type==='search'||e.target.type==='number')))onField(e)});
document.addEventListener('change',onField);
function reposDD(){const p=document.querySelector('.ddp:not([hidden])');if(!p)return;const c=p.closest('.combo'),r=c.querySelector('input').getBoundingClientRect();if(r.bottom<0||r.top>innerHeight){closeDD();return}openDD(c)}
window.addEventListener('scroll',reposDD,{passive:true});window.addEventListener('resize',reposDD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDD()}if(e.key==='Enter'&&e.target.id==='pinIn')A.pinOk()});
/* selects that pick a hotel */
document.addEventListener('change',e=>{const t=e.target;if(['dashSel','detSel','findSel'].includes(t.id)){UI.sel=t.value;render()}});

applyTheme();render();
</script>
