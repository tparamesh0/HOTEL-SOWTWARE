function lum(hex){const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)}
function mixW(hex,t){const n=parseInt(hex.slice(1),16),m=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return '#'+m(n>>16)+m((n>>8)&255)+m(n&255)}
function isDark(){const m=S.set.mode;if(m==='dark')return true;if(m==='light')return false;const t=document.documentElement.dataset.theme;if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){const c={...S.set.colors},r=document.documentElement.style,dk=isDark();
 if(dk){Object.assign(c,{bg:'#17181a',side:'#202124',card:'#25272a',text:'#e8eaed',soft:'#9aa0a6'});c.main=mixW(c.main,.35)}
 {const dp=S.set.depth==null?50:+S.set.depth;if(dp!==50){c.main=depthHex(c.main,dp);c.accent=depthHex(c.accent,dp)}const bt=+S.set.bgTint||0;if(bt&&!dk){c.bg=mixHex(c.bg,S.set.colors.main,bt/100);c.side=mixHex(c.side,S.set.colors.main,bt/200)}}
 for(const k in c)r.setProperty('--'+k,c[k]);
 r.setProperty('--line',dk?'#3a3d41':'#e6e9ec');
 r.setProperty('--onmain',lum(c.main)>.42?'#202124':'#ffffff');r.setProperty('--onaccent',lum(c.accent)>.3?'#202124':'#ffffff');
 r.setProperty('--mainsoft',`color-mix(in srgb,${c.main} ${dk?22:12}%,${c.card})`);
 r.setProperty('--r',S.set.round+'px');r.setProperty('--fh',`'${S.set.font}',system-ui,sans-serif`);r.fontSize=(S.set.fs||15)+'px';
 r.colorScheme=dk?'dark':'light';themeExtra(r,c,dk);if(S.set.pro)r.setProperty('--fh',`'DM Sans',system-ui,sans-serif`);
 document.body.classList.toggle('compact',!!S.set.compact);document.body.classList.toggle('noemoji',!S.set.emoji);document.body.classList.toggle('pro',!!S.set.pro);document.body.classList.toggle('ic3',!!S.set.icons3d);if(S.set.icons3d)setTimeout(ic3Start,0)}

function docsCard(){if(!UI.docCache){docAll().then(L=>{UI.docCache=L;if(UI.page==='settings'&&UI.sset==='docs'){const y=scrollY;render();scrollTo(0,y)}});return `<div class="card"><h3>📄 Use documents</h3><p class="mini">Loading…</p></div>`}const L=UI.docCache,q=(UI.docQ||'').trim().toLowerCase(),V=L.filter(d=>!q||d.name.toLowerCase().includes(q));
 return `<div class="card"><div class="row" style="justify-content:space-between;gap:10px"><div><h3>📄 Use documents</h3><p class="mini" style="margin-top:4px">Every quotation, invoice and PDF made in the software is kept here automatically${window.mmpc?' — also saved on this PC in <b>Documents › Magic Memories › Documents</b>':''}. Add your own PDFs too, and send any of them on WhatsApp.</p></div><label class="btn" for="docIn">＋ Add documents</label><input id="docIn" class="sr" type="file" accept="application/pdf,image/*" multiple data-file="docs"></div><div class="row" style="gap:8px;margin:12px 0"><input type="search" data-docq="1" value="${esc(UI.docQ||'')}" placeholder="Search documents…" aria-label="Search documents" style="max-width:280px"><span class="mini">${L.length} document${L.length===1?'':'s'} · ${fmtSize(L.reduce((a,d)=>a+(d.size||0),0))}</span>${window.mmpc?'<button class="btn ghost sm" data-a="docFolder">📂 Open folder</button>':''}</div>${V.length?`<div class="dlist">${V.map(d=>`<div class="dli"><span class="dic" aria-hidden="true">${/pdf/.test(d.type)?'📕':'🖼️'}</span><div style="flex:1;min-width:0"><b class="dln">${esc(d.name)}</b><div class="mini">${new Date(d.date).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})} · ${fmtSize(d.size||0)}${d.kind?' · '+esc(d.kind):''}</div></div><button class="btn ghost sm" data-a="docOpen" data-k="${d.id}">👁 Open</button><button class="btn sm" style="background:#25d366;color:#fff" data-a="docWa" data-k="${d.id}">💬 WhatsApp</button><button class="btn red sm" data-a="docDel" data-k="${d.id}" aria-label="Delete ${esc(d.name)}">🗑</button></div>`).join('')}</div>`:'<div class="dempty"><div style="font-size:2.4rem">📄</div><p>No documents yet — they appear here when you make a quotation or invoice PDF.</p></div>'}</div>`}
function docChooser(cb,title){UI.dcb=cb;const show=async()=>{const L=UI.dpick?await docAll():[];pickLayer(`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>📎 ${esc(title||'Choose a document')}</h3><button class="hvx2" data-a="pickClose" aria-label="Close">✕</button></div><div class="grid g2" style="gap:10px"><label class="pkopt" for="dpkIn"><span style="font-size:2rem">💻</span><b>From this PC</b><span class="mini">Pick a PDF or photo file</span></label><input id="dpkIn" class="sr" type="file" accept="application/pdf,image/*" data-file="dpick"><button class="pkopt" data-a="dpkLib"><span style="font-size:2rem">📄</span><b>From “Use documents”</b><span class="mini">Saved quotations, invoices &amp; PDFs</span></button></div>${UI.dpick?`<div class="lbl" style="margin-top:14px">Use documents — tap one</div>${L.length?`<div class="dlist" style="max-height:46vh;overflow:auto">${L.map(d=>`<button class="dli dlb" data-a="dpkOne" data-k="${d.id}"><span class="dic">${/pdf/.test(d.type)?'📕':'🖼️'}</span><span style="flex:1;min-width:0;text-align:left"><b class="dln">${esc(d.name)}</b><span class="mini" style="display:block">${new Date(d.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · ${fmtSize(d.size||0)}</span></span></button>`).join('')}</div>`:'<p class="mini">No saved documents yet.</p>'}`:''}`)};UI.dshow=show;show()}
async function sendFileWA(blob,name,phone,msg){const num=waNum(phone);if(window.mmpc){try{const rec=await docAdd(blob,name,'sent');let p=rec.path;if(!p)p=await mmpc.saveDoc(name,new Uint8Array(await blob.arrayBuffer()));await mmpc.copyFile(p);const how=await mmpc.openWA(num,msg);if(how==='none')return;if(how==='app'){await waAutoGo(num,msg,'PDF')}else{toast(how==='app'?'📋 PDF copied — in WhatsApp press Ctrl+V, then Enter to send':'📋 PDF copied and saved — in WhatsApp press Ctrl+V, then Enter');}return}catch(e){console.error(e)}}
 docAdd(blob,name,'sent');const file=new File([blob],name,{type:blob.type||'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text:msg});return}}catch(x){if(x&&x.name==='AbortError')return}dlFile(name,blob);toast('PDF downloaded — attach it in the WhatsApp chat');setTimeout(()=>{const a=document.createElement('a');a.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()},600)}
function waDocAsk(blob,name){UI.wdoc={blob,name,phone:UI.wdoc&&UI.wdoc.phone||''};pickLayer(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>💬 Send on WhatsApp</h3><button class="hvx2" data-a="pickClose" aria-label="Close">✕</button></div><p class="mini" style="margin-bottom:10px">📕 <b>${esc(name)}</b></p><div class="lbl">WhatsApp number</div><input type="tel" data-wdoc="phone" value="${esc(UI.wdoc.phone)}" placeholder="10-digit number"><div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn ghost" data-a="pickClose">Cancel</button><button class="btn" style="background:#25d366;color:#fff" data-a="wdocGo">💬 Send</button></div>`)}

const ZN=()=>S.set.zones=S.set.zones||[{name:'Zone 1',color:'#0ea5e9'},{name:'Zone 2',color:'#8b5cf6'}];
const zoneTag=z=>{if(!z)return '';const o=ZN().find(x=>x.name===z);return `<span class="ztag" style="--z:${o?o.color:'#64748b'}">📍 ${esc(z)}</span>`};
function zonesCard(){const Z=ZN(),isl=UI.zIsl||UI.island,H=S.hotels.filter(h=>h.island===isl).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="card" style="margin-bottom:16px"><h3>📍 Zones</h3><p class="mini" style="margin:4px 0 12px">Add as many zones as you need. Every hotel can be in one zone or none. Zones show on hotel cards and can be filtered in All Hotels and Find / Search.</p>${Z.map((z,i)=>`<div class="zrow"><input type="color" data-zc="${i}" value="${esc(z.color||'#0ea5e9')}" aria-label="Zone colour"><input type="text" data-zn="${i}" value="${esc(z.name)}" aria-label="Zone name"><span class="mini">${S.hotels.filter(h=>h.zone===z.name).length} hotels</span><button class="btn red sm" data-a="zoneDel" data-k="${i}" aria-label="Delete ${esc(z.name)}">🗑</button></div>`).join('')}<button class="btn ghost" data-a="zoneAdd" style="margin-top:8px">＋ Add zone</button></div>
 <div class="card"><div class="row" style="justify-content:space-between;gap:10px"><h3>Set zone for each hotel</h3><div class="seg">${S.set.islands.map(i=>`<button class="${isl===i.name?'on':''}" data-a="zIsl" data-k="${esc(i.name)}">${esc(i.name)}</button>`).join('')}</div></div><div class="ztab">${H.map(h=>`<div class="zh"><span class="hn" style="flex:1;min-width:0">${esc(h.name)}</span><div class="zch">${[['','None'],...Z.map(z=>[z.name,z.name])].map(([v,l])=>`<button class="zc ${(h.zone||'')===v?'on':''}" style="--z:${(Z.find(z=>z.name===v)||{}).color||'#64748b'}" data-a="zoneHotel" data-id="${h.id}" data-k="${esc(v)}">${esc(l)}</button>`).join('')}</div></div>`).join('')}</div></div>`}

const compTermsHTML=()=>{const L=String(S.set.docTxt.compTerms||'').split('\n').map(x=>x.trim()).filter(Boolean);return L.length?`<div class="ctm"><span class="k">Complimentary terms</span><ol>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''};

function docPoster(cur,mode){UI.pqCtx={cur:String(cur),hid:UI.snapE?UI.snapE.id:null};const c=S.set.company,m=S.set.docMeta,P=PST(),pk=S.set.pkgPicks[cur]||{},np=pkP(cur),tot=docTotal(cur),days=Object.keys(pk).map(Number).filter(d=>d<=+cur+1).sort((a,b)=>a-b),dimg=[PIMG.d1,PIMG.d2,PIMG.d3,PIMG.d4,PIMG.d5],cols=Math.min(Math.max(days.length,1),5),hdr=['#1d4ed8','#16a34a'];
 const phones=(P.phones||(c.team||[]).map(t=>t.phone).filter(Boolean).slice(0,2).join(', ')||c.phone||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean).slice(0,3);
 const svcI=['💼','✈️','📷','🏨','🚕','🎟️'],svc=String(P.svc||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,4),gift=String(P.gift||'').split('|'),comp=pkC(cur);
 const dayCol=(d,k)=>{const p=pk[d]||{},st=(p.stops||[]).map(x=>String(x).trim()).filter(Boolean),c2=hdr[k%2];return `<div class="pqd" data-d="${d}"><div class="pqdh" style="--h:${c2}">📍 DAY ${d}</div><div class="pqdt" style="--h:${c2}">${esc(String(p.name||'').toUpperCase())}</div><ul>${st.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.place?`<div class="pqst">🛏️ Stay: ${esc(p.place)}</div>`:''}<div class="pqph" style="background-image:url('${pqPhotoFor(p,k)}')"></div></div>`};
 return `<div class="pq"><div class="pqtop"><div class="pqlogo">${S.set.logo?`<img src="${esc(S.set.logo)}" alt="Logo">`:S.set.blank?'':`<img src="${PIMG.logo}" alt="Logo">`}</div><div class="pqsv">${svc.map((x,i)=>`<div><span class="pqci">${svcI[i]||'✔️'}</span>${esc(x)}</div>`).join('')}</div><div class="pqbk"><div><span class="pqci">👤</span>${esc(P.book||'')}</div><div class="pqtag">${String(P.tag||'').split('\n').map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></div>
 <div class="pqwave"></div><img class="pqisl" src="${PIMG.island}" alt="">
 <div class="pqname">${esc(c.name||'')}</div><div class="pqqt"><span>QUOTATION</span></div>
 <div class="pqmeta"><div class="pqto"><span class="pqci">👤</span>To: <b>${esc(m.name||'—')}</b>${m.phone?`<small>· ${esc(m.phone)}</small>`:''}</div><div class="pqtour"><span class="pqci">💼</span>Tour: <b>${esc(pkgLabel(+cur))} • ${np} person${np===1?'':'s'}</b></div></div>
 <div class="pqdays" style="grid-template-columns:repeat(${cols},1fr)">${days.map(dayCol).join('')||'<div class="pqd"><div class="pqdt">Add day packages</div></div>'}</div>
 <div class="pqgift"><img src="${PIMG.gift}" alt=""><div><b>${esc(gift[0]||'')}</b> <i>${esc(gift[1]||'')}</i>${comp.length?`<div class="pqgl">${comp.map(x=>esc(x.name)).join(' • ')}</div>`:''}</div><img src="${PIMG.gift}" alt=""></div>
 <div class="pqtot"><img src="${PIMG.bag}" alt=""><div class="pqtl"><b>TOTAL PACKAGE AMOUNT:</b><small>(${np} person${np===1?'':'s'}, tax/GST included)</small></div><div class="pqamt">${inr(tot)}</div></div>${(()=>{const PP=ppInfo(cur),cf2=S.set.docCfg[mode==='customer'?'customer':'agent'];return PP&&cf2.perperson!==0?`<div class="pqpp">${PP.same?`${ppL().toUpperCase()}: <b>${ppFmt(PP.a[0])}</b>`:PP.a.map((v,k)=>`PERSON ${k+1}: <b>${inr(v)}</b>`).join(' &nbsp;|&nbsp; ')}</div>`:''})()}
 <div class="pqfoot">${phones.map(x=>`<span><i class="pqwa">✆</i>${esc(x)}</span>`).join('<b>|</b>')}${c.email?`<b>|</b><span><i class="pqml">✉</i>${esc(c.email)}</span>`:''}</div></div>`}

 const req=[['Island chosen',!!m.island]];if(nw)req.push(['Class chosen',!!m.tier]);req.push([dup?'Hotel name already exists on this island':'Hotel name',!!m.name.trim()&&!dup]);if(nw)req.push(['Mobile number',m.mobiles.some(x=>x.trim())],['1 room category with a price',hasRoom]);

function validate(m,mode){const nw=mode==='new',E=[],add=(msg,f)=>E.push({msg,f});
 if(!m.island)add('Choose an island','island');

 m.emails.forEach((v,i)=>{if(v.trim()&&!/^\S+@\S+\.\S+$/.test(v.trim()))add('Email '+(i+1)+' looks wrong — it should look like name@example.com','emails.'+i)});
 let any=false;const seen={};
 m.rooms.forEach((r,i)=>{const cat=r.category.trim().toUpperCase(),pr=Object.entries(r.p||{}).filter(([k,v])=>v!=null&&v!=='');
  if(!cat&&pr.length)add('Room row '+(i+1)+': type the room category (it has prices)','rooms.'+i+'.category');

  if(nw&&cat&&!pr.length)add('Room row '+(i+1)+' ('+cat+'): enter at least one price','rooms.'+i+'.p.'+(m.plansOn[0]||'CP'));

 return E}

function clrDraw(){const n=UI.clr.n,C=2*Math.PI*54;openModal(`<div class="clrm"><h3>🗑️ Clear all data</h3>${n>0?`<p class="mini" style="margin:6px 0 14px">Wait for the countdown. You can still cancel.</p><div class="cdw" role="timer" aria-live="polite" aria-label="${n} seconds left"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" class="cdb"/><circle cx="60" cy="60" r="54" class="cdr" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-n/10)}"/></svg><b>${n}</b></div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" data-a="clrCancel">Cancel</button></div>`:`<p style="margin:8px 0">This will permanently delete <b>everything</b> in this software. It cannot be undone.</p><button class="btn ghost sm" data-a="bkFile" style="margin-bottom:12px">⬇ Export a backup first</button><div class="lbl">To confirm, type DELETE</div><input id="clrIn" type="text" data-clr="1" data-nocap="1" autocomplete="off" placeholder="DELETE"><div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ghost" data-a="clrCancel">Cancel</button><button class="btn red" data-a="clrDo" id="clrGo" disabled>🗑️ Yes, delete everything</button></div>`}</div>`);const o=document.querySelector('.ov');if(o)o.dataset.sticky=1;if(!n)setTimeout(()=>{const i=$('#clrIn');if(i)i.focus()},50)}
function clrStop(){if(UI.clr&&UI.clr.t)clearInterval(UI.clr.t);UI.clr=null}
Object.assign(A,{
 clrStart:()=>{clrStop();UI.clr={n:10};clrDraw();UI.clr.t=setInterval(()=>{if(!UI.clr)return;UI.clr.n--;if(UI.clr.n<=0){clearInterval(UI.clr.t);UI.clr.t=0;UI.clr.n=0}clrDraw()},1000)},

 <div class="card"><div class="tw"><table><tr><th></th><th>HOTEL</th><th>CLASS</th><th>ZONE</th><th class="n">STARTING RATE</th><th>STAR</th></tr>${list.map(h=>`<tr><td style="width:36px"><input type="checkbox" style="width:18px;height:18px;min-height:0" data-a-change="chk" data-id="${h.id}" ${UI.checked[h.id]?'checked':''} aria-label="Select ${esc(h.name)}"></td><td class="hn">${esc(h.name)}</td><td>${h.tier?esc(h.tier):'<span class="mini">—</span>'}</td><td>${h.zone?esc(h.zone):'<span class="mini">—</span>'}</td><td class="n">${inr(minRate(h))}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${L.map(z=>`<button class="pill" data-a="starHotel" data-id="${h.id}" data-k="${z}" style="${+h.star===z?fg(z):''}" aria-pressed="${+h.star===z}">${z} ★</button>`).join('')}${h.star?`<button class="pill" data-a="starHotel" data-id="${h.id}" data-k="" title="Remove star" aria-label="Remove star">✕</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="6" class="mini" style="padding:18px;text-align:center">No hotels in this view.</td></tr>`}</table></div></div>`};

 sbulk:el=>{const v=el.dataset.k?+el.dataset.k:null,ids=Object.keys(UI.checked).filter(k=>UI.checked[k]);ids.forEach(id=>{const h=S.hotels.find(x=>x.id===id);if(h)h.star=v});UI.checked={};save();toast(v?ids.length+' hotel(s) set to '+v+' ★':'Star cleared');const y=scrollY;render();scrollTo(0,y)},

});

const HAO=h=>{UI.hao=UI.hao||{};return UI.hao[h.id]=UI.hao[h.id]||{mode:'hotel',sel:[]}};

function hexRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16,(n>>8)&255,n&255]}

function depthHex(h,v){const t=(v-50)/50;if(t>0)return shadeHex(satHex(h,t*.5),t*.82);return shadeHex(h,t*.85)}
function mixHex(a,b,t){const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t))}
