<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5f8a">
<title>Magic Memories — My Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#0b5f8a;--sea2:#0891b2;--lagoon:#06b6d4;--sand:#fff7ed;--sun:#f59e0b;--leaf:#16a34a;--coral:#ef4444;--ink:#0f172a;--soft:#64748b;--line:#e2e8f0;--card:#ffffff;--bg:#f1f7fb;--r:20px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e2e8f0;--soft:#94a3b8;--line:#1e293b;--card:#0f1b2b;--bg:#07111d;--sand:#1a1408;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit}img{max-width:100%}
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.scr[hidden],[hidden]{display:none!important}
.fade-in{animation:fin .45s ease both}@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* splash */
#splash{background:radial-gradient(120% 80% at 50% 0%,#38bdf8 0%,#0b5f8a 55%,#06324d 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.slogo{width:min(46vw,190px);aspect-ratio:1/1;border-radius:50%;background:#fff;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:lpop 1s cubic-bezier(.2,.9,.3,1.3) both;position:relative}
.slogo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.slogo::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.55);animation:ring 1.8s ease-out .5s infinite}
@keyframes lpop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
.sname{font-weight:800;font-size:1.35rem;letter-spacing:.02em;animation:fin .6s .45s both}.swel{opacity:.9;animation:fin .6s .7s both}
.waves{position:absolute;left:0;right:0;bottom:0;height:90px;opacity:.35;background:repeating-radial-gradient(circle at 50% 160%,transparent 0 18px,rgba(255,255,255,.5) 19px 21px)}
/* login */
#login{background:linear-gradient(180deg,#0b5f8a 0,#0b5f8a 210px,var(--bg) 210px)}
.lhead{color:#fff;text-align:center;padding:28px 20px 70px}.lhead img{width:78px;height:78px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}
.lhead h1{margin:8px 0 2px;font-size:1.2rem}.lhead p{margin:0;opacity:.85;font-size:.85rem}
.lcard{margin:-50px 16px 0;background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 12px 34px rgba(2,32,56,.12)}
.lbl{font-size:.8rem;font-weight:600;color:var(--soft);margin:12px 0 6px;display:block}
.inp{width:100%;font:inherit;font-size:1.15rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.inp:focus{border-color:var(--lagoon)}
.pins{display:flex;gap:10px}.pins input{width:56px;height:60px;text-align:center;font-size:1.5rem;font-weight:800;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}.pins input:focus{border-color:var(--lagoon)}
.big{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--sea),var(--lagoon));color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 10px 24px rgba(8,145,178,.35)}
.big:disabled{opacity:.6}.err{color:var(--coral);font-size:.86rem;margin-top:10px;min-height:1.2em}.hint{color:var(--soft);font-size:.78rem;margin-top:14px;text-align:center}
/* welcome */
#welcome{background:linear-gradient(160deg,#06b6d4,#0b5f8a);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
#welcome h1{font-size:2rem;margin:10px 0 6px}#welcome p{margin:4px 0;opacity:.95}.wv{font-size:3.4rem;animation:wave 1.6s ease-in-out infinite;display:inline-block;transform-origin:70% 70%}@keyframes wave{0%,60%,100%{transform:none}20%{transform:rotate(14deg)}40%{transform:rotate(-8deg)}}
.wbtn{margin-top:22px;background:#fff;color:var(--sea);border:0;border-radius:999px;padding:13px 26px;font-weight:700;cursor:pointer}
/* home */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,var(--sea),var(--sea2));color:#fff}
.top img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}.top b{flex:1;font-size:.95rem;line-height:1.15}.top small{display:block;font-weight:500;opacity:.85;font-size:.7rem}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib i{position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-style:normal;font-size:.65rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.wrap{padding:14px 16px 120px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 18px rgba(2,32,56,.06)}
.hero{background:linear-gradient(135deg,var(--sea),var(--lagoon));color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.8}.hero h2{margin:2px 0 8px;font-size:1.45rem}.hero .pk{font-weight:700;font-size:1.02rem}.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:.76rem;font-weight:600}
.offline{background:#fef3c7;color:#78350f;border-radius:14px;padding:8px 12px;font-size:.8rem}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;scroll-snap-align:start;min-width:74px;border:0;border-radius:16px;padding:9px 12px;background:var(--card);box-shadow:0 2px 10px rgba(2,32,56,.06);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .2s,background .2s}
.dt b{font-size:.92rem}.dt small{font-size:.66rem;color:var(--soft)}.dt.on{background:var(--sea);color:#fff;transform:translateY(-2px)}.dt.on small{color:rgba(255,255,255,.85)}.dt.lk{opacity:.6}.dt.today::after{content:"TODAY";font-size:.55rem;font-weight:800;color:var(--sun);letter-spacing:.08em}
.dbar{display:flex;gap:8px;align-items:center}.ie{border:0;border-radius:999px;padding:9px 14px;background:var(--sand);color:#9a3412;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap}
.dhd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.dhd h3{margin:0;font-size:1.1rem}.dhd small{color:var(--soft)}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#4ade80);border-radius:8px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tl{position:relative;margin-top:12px}.tl::before{content:"";position:absolute;left:21px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--lagoon),var(--line))}
.ti{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:8px 0;animation:fin .45s ease both}
.tdot{width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--lagoon);display:flex;align-items:center;justify-content:center;font-size:1.15rem;z-index:1;transition:all .3s}
.ti.done .tdot{background:var(--leaf);border-color:var(--leaf);color:#fff}.ti.now .tdot{border-color:var(--sun);box-shadow:0 0 0 6px rgba(245,158,11,.2);animation:pulse 1.8s infinite}.ti.next .tdot{border-color:var(--sea)}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.ti.now .tc{border-color:var(--sun);box-shadow:0 8px 24px rgba(245,158,11,.18)}.ti.done .tc{opacity:.78}
.tc img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover}
.tb{padding:12px 14px}.tt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ttime{font-weight:800;color:var(--sea2);font-size:.9rem}.st{font-size:.66rem;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--soft)}.st.now{background:#fef3c7;color:#92400e}.st.done{background:#dcfce7;color:#166534}.st.next{background:#e0f2fe;color:#075985}
.tb h4{margin:4px 0 2px;font-size:1.02rem}.pl{color:var(--soft);font-size:.82rem}.ds{font-size:.86rem;margin:6px 0 0;line-height:1.5}.ins{margin-top:8px;font-size:.8rem;background:var(--sand);color:#9a3412;border-radius:12px;padding:7px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem;margin-top:8px}.kv span{color:var(--soft)}
.hl{display:flex;gap:8px;margin-top:10px}.hl div{flex:1;border-radius:14px;padding:8px 10px;text-align:center}.hl small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.hl b{font-size:1.15rem}
.hl .rep{background:#fef3c7;color:#92400e}.hl .dep{background:#e0f2fe;color:#075985}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ab{border:0;border-radius:999px;padding:8px 13px;font-weight:600;font-size:.8rem;cursor:pointer;background:var(--bg);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.ab.ok{background:var(--leaf);color:#fff}.ab.pri{background:var(--sea);color:#fff}
.lock{text-align:center;padding:30px 16px}.lock .lk{font-size:3rem;animation:shake 2.4s ease-in-out infinite}@keyframes shake{0%,90%,100%{transform:none}93%{transform:rotate(-10deg)}96%{transform:rotate(10deg)}}
.cd{display:flex;gap:8px;justify-content:center;margin-top:12px}.cd div{background:var(--bg);border-radius:14px;padding:8px 12px;min-width:62px}.cd b{display:block;font-size:1.3rem}.cd small{font-size:.65rem;color:var(--soft)}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.al:last-child{border-bottom:0}.al .ic{font-size:1.3rem}.al b{font-size:.9rem}.al p{margin:2px 0 0;font-size:.8rem;color:var(--soft)}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;transition:all .25s}.doc.ok .cb{background:var(--leaf);border-color:var(--leaf);color:#fff}
.help{background:linear-gradient(135deg,#0f172a,#0b5f8a);color:#fff}.help h3{margin:0 0 4px}.help p{white-space:pre-line;opacity:.9;font-size:.86rem;margin:6px 0 12px}.help .ab{background:rgba(255,255,255,.15);color:#fff}.help .ab.wa{background:#25d366}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:13px 18px;background:#25d366;color:#fff;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.25);cursor:pointer}
/* sheets & modals */
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,12,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:fo .2s both}@keyframes fo{from{opacity:0}}
.sh{width:100%;max-width:640px;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:su .32s cubic-bezier(.2,.9,.3,1) both}@keyframes su{from{transform:translateY(100%)}}
.sh h3{margin:0 0 4px}.x{float:right;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.mid{align-items:center;padding:20px}.mid .sh{border-radius:26px;text-align:center;max-width:420px}
.ies{display:grid;gap:12px;margin-top:12px}.ies ul{margin:6px 0 0;padding-left:20px}.ies li{margin:4px 0;font-size:.9rem}.inc{background:#f0fdf4;color:#14532d;border-radius:16px;padding:12px 14px}.exc{background:#fef2f2;color:#7f1d1d;border-radius:16px;padding:12px 14px}
.stars{display:flex;gap:6px;justify-content:center;margin:14px 0}.stars button{border:0;background:none;font-size:2.3rem;cursor:pointer;color:#cbd5e1;transition:transform .15s}.stars button.on{color:#f59e0b}.stars button:active{transform:scale(1.25)}
.nt{padding:12px 0;border-bottom:1px solid var(--line)}.nt.new b::before{content:"● ";color:var(--coral)}.nt p{margin:3px 0 0;font-size:.85rem;white-space:pre-line}.nt small{color:var(--soft);font-size:.72rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px);animation:fin .3s both}
.chk{width:80px;height:80px;margin:0 auto}.chk circle{stroke:var(--leaf);stroke-width:4;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:dr .6s ease forwards}.chk path{stroke:var(--leaf);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .5s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.empty{text-align:center;color:var(--soft);padding:18px 8px;font-size:.88rem}
.menu{position:absolute;right:12px;top:58px;z-index:9;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:6px;min-width:220px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:.9rem}.menu button:hover{background:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head>
<body>
<div id="splash" class="scr"><div class="slogo"><img id="lg1" alt="Magic Memories Tours and Travels logo"></div><div class="sname">Magic Memories Tours and Travels</div><div class="swel">Welcome Our Valuable Customer</div><div class="waves" aria-hidden="true"></div></div>
<div id="login" class="scr" hidden></div>
<div id="welcome" class="scr" hidden></div>
<div id="home" class="scr" hidden></div>
<div id="layer"></div>
<script>
const LOGO=''/*__LOGO__*/;
const SB_URL='https://cyjaueyafftscpgviflm.supabase.co',SB_KEY='__SB_KEY__';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('mmc.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mmc.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mmc.'+k)}catch(e){}}};
let ST={tok:LS.get('tok',null),data:LS.get('data',null),at:LS.get('at',0),day:null,offline:false,skew:0,ver:''};
document.querySelectorAll('#lg1').forEach(i=>i.src=LOGO);
if(LS.get('rm',false))document.documentElement.classList.add('rm');
async function rpc(fn,args,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);try{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{}),signal:c.signal});if(!r.ok){let m='Server error '+r.status;try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}return await r.json()}finally{clearTimeout(t)}}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
function show(id){['splash','login','welcome','home'].forEach(s=>$('#'+s).hidden=s!==id)}
const first=n=>String(n||'').replace(/\(.*?\)/g,'').trim().split(/\s+/)[0]||'';
/* ---- time in the tour's time zone, from SERVER time (never the phone clock) ---- */
const TZ=()=>(ST.data&&ST.data.booking&&ST.data.booking.tz)||'Asia/Kolkata';
const nowS=()=>new Date(Date.now()+ST.skew);
function tzParts(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return {date:o.year+'-'+o.month+'-'+o.day,min:(+o.hour%24)*60+ +o.minute,h:+o.hour%24}}
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(String(t||''));if(!m)return null;let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h*60+ +m[2]};
const durMin=s=>{s=String(s||'').toLowerCase();let m=0;const h=/(\d+(?:\.\d+)?)\s*h/.exec(s),mi=/(\d+)\s*m/.exec(s);if(h)m+=parseFloat(h[1])*60;if(mi)m+=+mi[1];return m||60};
const fdate=(iso,o)=>new Date(iso+'T00:00').toLocaleDateString('en-GB',o||{weekday:'short',day:'2-digit',month:'short'});

/* ---------- login ---------- */
function loginView(err){show('login');$('#login').innerHTML=`<div class="lhead fade-in"><img src="${LOGO}" alt=""><h1>Magic Memories Tours and Travels</h1><p>Your personal tour companion</p></div>
 <form class="lcard fade-in" id="lf" novalidate><h2 style="margin:0 0 4px;font-size:1.2rem">Open my tour</h2><p style="margin:0;color:var(--soft);font-size:.85rem">Enter the Booking ID sent to you by Magic Memories.</p>
 <label class="lbl" for="bid">Booking ID</label><input class="inp" id="bid" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MM-XXXXXX" maxlength="12" value="${esc(LS.get('lastCode',''))}">
 <label class="lbl" id="pinl">Last 4 digits of your mobile number</label><div class="pins" role="group" aria-labelledby="pinl">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-p="${i}" autocomplete="off">`).join('')}</div>
 <div class="err" id="lerr" role="alert">${esc(err||'')}</div><button class="big" id="lgo" type="submit">Open my tour →</button>
 <div class="hint">🔒 Your details are private — only you can see your booking.</div></form>`;
 const P=[...document.querySelectorAll('[data-p]')];P.forEach((p,i)=>{p.addEventListener('input',()=>{p.value=p.value.replace(/\D/g,'').slice(-1);if(p.value&&P[i+1])P[i+1].focus()});p.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!p.value&&P[i-1])P[i-1].focus()})});
 $('#lf').addEventListener('submit',async e=>{e.preventDefault();const code=$('#bid').value.trim().toUpperCase(),pin=P.map(p=>p.value).join('');if(code.replace(/^MM-/,'').length<6){$('#lerr').textContent='Enter your full Booking ID';return}if(pin.length!==4){$('#lerr').textContent='Enter the last 4 digits of your mobile number';return}
  const b=$('#lgo');b.disabled=true;b.textContent='Checking…';$('#lerr').textContent='';
  try{const r=await rpc('mmc_login',{p_code:code,p_verify:pin,p_device:(navigator.userAgent||'').slice(0,60)});if(!r||!r.ok){$('#lerr').textContent=(r&&r.err)||'Could not open the booking';b.disabled=false;b.textContent='Open my tour →';return}
   ST.tok=r.token;LS.set('tok',r.token);LS.set('lastCode',code);ST.data=null;LS.del('data');LS.set('seen',{});welcomeView(r.name)}
  catch(x){$('#lerr').textContent=navigator.onLine?'Could not reach the server. Please try again.':'No internet connection. Connect and try again.';b.disabled=false;b.textContent='Open my tour →'}});}
function welcomeView(name){show('welcome');$('#welcome').innerHTML=`<div class="fade-in"><div class="wv" aria-hidden="true">👋</div><h1>Welcome, ${esc(first(name))}!</h1><p>We're delighted to have you with us.</p><p style="font-weight:700;font-size:1.1rem;margin-top:10px">Your Journey Begins Here!</p><button class="wbtn" id="wgo">Open my tour</button></div>`;const go=()=>{clearTimeout(t);boot()};const t=setTimeout(go,3200);$('#wgo').onclick=go}

/* ---------- data ---------- */
async function load(silent){if(!ST.tok){loginView();return false}
 try{const d=await rpc('mmc_data',{p_token:ST.tok});if(!d||!d.ok){if(d&&d.err==='session'){logout(true,'Your session has ended. Please open your booking again.');return false}throw new Error('bad')}
  const prev=ST.data;ST.skew=new Date(d.now)-Date.now();ST.data=d;ST.at=Date.now();ST.offline=false;LS.set('data',d);LS.set('at',ST.at);
  if(prev&&prev.unlocked<d.unlocked&&d.unlocked>0){notify('🌅 Day '+d.unlocked+' is now available',`Good Morning! Day ${d.unlocked} of your ${d.booking.package||'tour'} is now available. Open to explore today's schedule.`);ST.day=d.unlocked}
  if(prev){const old=new Set((prev.notifs||[]).map(n=>n.id));(d.notifs||[]).filter(n=>!old.has(n.id)).forEach(n=>notify(n.title,n.body))}
  return true}catch(e){ST.offline=true;if(!silent&&!ST.data)toast('No connection — showing saved information');return !!ST.data}}

async function poll(){if(!ST.tok||document.hidden)return;try{const v=await rpc('mmc_ver',{p_token:ST.tok},8000);if(v==='session'){logout(true,'Your session has ended. Please open your booking again.');return}if(v!==ST.ver){const f0=!ST.ver;ST.ver=v;if(!f0){await load(true);draw()}}ST.offline=false}catch(e){if(!ST.offline){ST.offline=true;draw()}}}

 const lab={done:['done','COMPLETED'],now:['now','ON NOW'],past:['','PENDING'],up:[isNext?'next':'',isNext?'UP NEXT':'UPCOMING']}[s];
 let extra='';if(it.kind==='ferry')extra=`<div class="hl">${dt.report?`<div class="rep"><small>Reporting</small><b>${esc(dt.report)}</b></div>`:''}${it.time?`<div class="dep"><small>Departure</small><b>${esc(it.time)}</b></div>`:''}</div><div class="kv">${[['Ferry',[dt.name,dt.number&&'#'+dt.number].filter(Boolean).join(' ')],['Report at',dt.reportAt],['Harbour',dt.harbour],['To',dt.to],['Ticket',dt.ticket],['Status',dt.status]].filter(x=>x[1]).map(x=>`<span>${x[0]}</span><b>${esc(x[1])}</b>`).join('')}</div>`;
 if(it.kind==='pickup')extra=`<div class="hl"><div class="dep"><small>Pickup time</small><b>${esc(it.time||'—')}</b></div>${dt.eta?`<div class="rep"><small>Journey</small><b>${esc(dt.eta)}</b></div>`:''}</div><div class="kv">${[['Wait at',it.place],['Vehicle',[dt.vehicle,dt.reg].filter(Boolean).join(' · ')],['Driver',dt.driver],['Next stop',dt.next]].filter(x=>x[1]).map(x=>`<span>${x[0]}</span><b>${esc(x[1])}</b>`).join('')}</div>`;
 const acts=[it.map&&`<a class="ab" href="${esc(it.map)}" target="_blank" rel="noopener">🗺️ Directions</a>`,it.kind==='pickup'&&dt.dphone&&`<a class="ab" href="tel:${esc(String(dt.dphone).replace(/[^\d+]/g,''))}">📞 Call driver</a>`,`<button class="ab ${s==='done'?'':'ok'}" data-mark="${it.id}" data-v="${s==='done'?0:1}">${s==='done'?'↺ Not done':'✓ Mark as done'}</button>`].filter(Boolean).join('');
 return `<div class="ti ${s==='done'?'done':s==='now'?'now':isNext?'next':''}" style="animation-delay:${Math.min(i*60,420)}ms"><div class="tdot" aria-hidden="true">${s==='done'?'✓':ic}</div><div class="tc">${it.photo?`<img src="${esc(it.photo)}" alt="${esc(it.title)}" loading="lazy">`:''}<div class="tb"><div class="tt"><span class="ttime">${esc(it.time||'')}</span><span class="st ${lab[0]}">${lab[1]}</span></div><h4>${esc(it.title||'')}</h4>${it.place&&it.kind!=='pickup'?`<div class="pl">📍 ${esc(it.place)}${it.duration?' · ⏱ '+esc(it.duration):''}</div>`:''}${it.descr?`<p class="ds">${esc(it.descr)}</p>`:''}${extra}${it.instructions?`<div class="ins">ℹ️ ${esc(it.instructions)}</div>`:''}<div class="acts">${acts}</div></div></div></div>`}
function countdown(iso){const ms=new Date(iso)-nowS();if(!(ms>0))return '';const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return `<div class="cd">${d?`<div><b>${d}</b><small>days</small></div>`:''}<div><b>${h}</b><small>hours</small></div><div><b>${m}</b><small>min</small></div></div>`}

 if(ST.day==null)ST.day=Math.max(1,Math.min(d.unlocked||1,b.days));const D=days[ST.day-1]||{day:ST.day,locked:true,items:[]},unread=(d.notifs||[]).filter(n=>!n.read_at).length;
 const items=(D.items||[]),nextIdx=D.locked?-1:items.findIndex(it=>{const s=stateOf(it,D.date,doneSet);return s==='up'||s==='now'}),doneN=items.filter(i=>doneSet.has(i.id)).length;

 const alerts=[];days.filter(x=>!x.locked&&x.date>=today).forEach(x=>(x.items||[]).forEach(it=>{if(doneSet.has(it.id))return;const dt=it.data||{};if(it.kind==='ferry')alerts.push(['⛴️',`Ferry ${x.date===today?'today':fdate(x.date)}: ${it.title||''}`,`Reporting ${dt.report||'—'}${dt.reportAt||dt.harbour?' at '+(dt.reportAt||dt.harbour):''} · Departure ${it.time||'—'}${dt.status?' · '+dt.status:''}`]);if(it.kind==='pickup')alerts.push(['🚕',`Cab pickup ${x.date===today?'today':fdate(x.date)} at ${it.time||'—'}`,`Wait at ${it.place||'—'}${(it.data||{}).vehicle?' · '+it.data.vehicle+' '+(it.data.reg||''):''}`])}));
 const pend=(d.docs||[]).filter(x=>!x.ready);if(pend.length)alerts.push(['📄',`${pend.length} document${pend.length===1?'':'s'} to keep ready`,pend.map(x=>x.name).join(', ')]);
 const h=d.help||{},ph=(h.phones||[]).filter(Boolean);
 $('#home').innerHTML=`<div class="top"><img src="${LOGO}" alt=""><b>Magic Memories<small>Tours and Travels</small></b><button class="ib" id="bell" aria-label="Notifications${unread?', '+unread+' new':''}">🔔${unread?`<i>${unread}</i>`:''}</button><button class="ib" id="mnu" aria-label="Menu" aria-expanded="false">⋮</button></div>
 <div class="wrap">${ST.offline?`<div class="offline" role="status">📴 Offline — showing information saved ${new Date(ST.at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'})}. It refreshes when you are back online.</div>`:''}
 <section class="card hero fade-in"><div class="lab">Passenger</div><h2>${esc(b.passenger)}</h2><div class="lab">Booked package</div><div class="pk">${esc(b.package||'Your tour')}</div><div class="meta"><span class="chip">🌙 ${b.nights} Night${b.nights===1?'':'s'} / ☀️ ${b.days} Day${b.days===1?'':'s'}</span><span class="chip">🗓️ ${fdate(b.start,{day:'2-digit',month:'short'})} – ${fdate(days.length?days[days.length-1].date:b.start,{day:'2-digit',month:'short'})}</span><span class="chip">👤 ${b.adults}${b.children?' + 🧒 '+b.children:''}</span><span class="chip">🎫 ${esc(b.code)}</span></div></section>
 <div class="dbar"><div class="days" role="tablist" aria-label="Tour days">${days.map(x=>`<button class="dt ${x.day===ST.day?'on':''} ${x.locked?'lk':''} ${x.date===today?'today':''}" role="tab" aria-selected="${x.day===ST.day}" data-day="${x.day}"><b>${x.locked?'🔒 ':''}Day ${x.day}</b><small>${fdate(x.date,{day:'2-digit',month:'short'})}</small></button>`).join('')}</div></div>
 <button class="ie" id="ieb" style="align-self:flex-start">✅ Included / ❌ Excluded · Day ${ST.day}</button>

  `<div class="dhd"><div><small>Day ${D.day} · ${fdate(D.date,{weekday:'long',day:'2-digit',month:'short'})}</small><h3>${esc(D.title||(D.date===today?"Today's itinerary":'Itinerary'))}</h3></div><small>${doneN}/${items.length} done</small></div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${doneN}"><i style="width:${items.length?Math.round(100*doneN/items.length):0}%"></i></div>
  <div class="tl">${items.length?items.map((it,i)=>itemCard(it,D,doneSet,i===nextIdx,i)).join(''):'<div class="empty">Your schedule for this day will appear here soon.</div>'}</div>`}</section>
 <section class="card"><h3 style="margin:0 0 4px">🔔 Important alerts & reminders</h3>${alerts.length?alerts.map(a=>`<div class="al"><span class="ic" aria-hidden="true">${a[0]}</span><div><b>${esc(a[1])}</b><p>${esc(a[2])}</p></div></div>`).join(''):'<div class="empty">No pending alerts. Enjoy your trip! 🌴</div>'}</section>
 ${(d.docs||[]).length?`<section class="card"><h3 style="margin:0 0 4px">📄 Document checklist</h3><p style="margin:0 0 4px;color:var(--soft);font-size:.8rem">Tap when a document is ready. ${(d.docs||[]).filter(x=>x.ready).length}/${d.docs.length} ready</p>${d.docs.map(x=>`<button class="doc ${x.ready?'ok':''}" data-doc="${x.id}" data-v="${x.ready?0:1}" aria-pressed="${x.ready}"><span class="cb" aria-hidden="true">${x.ready?'✓':''}</span><span><b style="font-size:.92rem">${esc(x.name)}</b>${x.note?`<br><small style="color:var(--soft)">${esc(x.note)}</small>`:''}</span></button>`).join('')}</section>`:''}

 <p style="text-align:center;color:var(--soft);font-size:.72rem">Magic Memories Tours and Travels · updated ${new Date(ST.at).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</p></div>
 ${h.whatsapp||ph.length?`<button class="fab" id="fab" aria-label="Help desk">🆘 Help</button>`:''}`;
 bind()}
function bind(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ST.day=+b.dataset.day;draw();const c=$('#dayc');if(c)c.classList.add('fade-in')});
 const on=$('.dt.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 $('#ieb').onclick=ieSheet;$('#bell').onclick=notifSheet;$('#mnu').onclick=menu;const f=$('#fab');if(f)f.onclick=()=>$('.help').scrollIntoView({behavior:'smooth'});
 document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(b.dataset.mark,b.dataset.v==='1',b));

async function mark(id,done,btn){btn.disabled=true;try{const r=await rpc('mmc_mark',{p_token:ST.tok,p_item:id,p_done:done});if(!r.ok)throw new Error(r.err);const s=new Set(ST.data.done||[]);done?s.add(id):s.delete(id);ST.data.done=[...s];LS.set('data',ST.data);
  if(done)celebrate();draw();const D=ST.data.days[ST.day-1];if(done&&D&&(D.items||[]).length&&(D.items||[]).every(i=>s.has(i.id)))setTimeout(()=>feedback(D.day,true),1300)}catch(e){btn.disabled=false;toast(navigator.onLine?'Could not save — try again':'No internet — try again when online')}}

/* ---------- greetings & feedback (once per day, server time) ---------- */
function fill(t){return String(t||'').replace(/\{name\}/g,first(ST.data.booking.passenger))}
function feedback(day,auto){const seen=LS.get('seen',{}),k='fb'+day;if(auto&&seen[k])return;seen[k]=1;LS.set('seen',seen);let stars=((ST.data.feedback||{})[day]||{}).stars||0;
 const o=modal(`<div style="font-size:2.6rem">🌅</div><h3>How Was Your Day?</h3><p style="color:var(--soft);margin:4px 0">We hope you had a wonderful day with us!<br>Rate Day ${day}'s experience.</p><div class="stars" role="radiogroup" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button role="radio" aria-checked="${n===stars}" aria-label="${n} star${n>1?'s':''}" data-s="${n}" class="${n<=stars?'on':''}">★</button>`).join('')}</div><textarea id="fbc" rows="2" placeholder="Anything you'd like to tell us? (optional)" style="width:100%;border-radius:14px;border:2px solid var(--line);padding:10px;font:inherit;background:var(--bg);color:var(--ink)">${esc(((ST.data.feedback||{})[day]||{}).comment||'')}</textarea><button class="big" id="fbs">Send rating</button><button class="ab" data-close style="margin-top:10px">Skip</button>`,true);
 o.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stars=+b.dataset.s;o.querySelectorAll('[data-s]').forEach(x=>{x.classList.toggle('on',+x.dataset.s<=stars);x.setAttribute('aria-checked',+x.dataset.s===stars)})});
 o.querySelector('#fbs').onclick=async()=>{if(!stars){toast('Tap the stars to rate');return}try{const r=await rpc('mmc_feedback_save',{p_token:ST.tok,p_day:day,p_stars:stars,p_comment:o.querySelector('#fbc').value});if(!r.ok)throw 0;(ST.data.feedback=ST.data.feedback||{})[day]={stars};LS.set('data',ST.data);o.remove();toast('Thank you for your feedback! 💙')}catch(e){toast('Could not send — try again')}}}
function greetings(){const d=ST.data;if(!d||!d.unlocked||document.querySelector('.ov'))return;const g=d.greet||{},now=tzParts(nowS()),seen=LS.get('seen',{}),D=(d.days||[]).find(x=>x.date===now.date&&!x.locked),done=new Set(d.done||[]);
 const prev=(d.days||[]).filter(x=>!x.locked&&x.date<now.date&&(x.items||[]).length&&(x.items||[]).every(i=>done.has(i.id))&&!(d.feedback||{})[x.day]).pop();
 if(prev&&!seen['fb'+prev.day]){feedback(prev.day,true);return}
 if(!D)return;const mf=tmin(g.morning_from||'05:00'),mt=tmin(g.morning_to||'11:59'),nf=tmin(g.night_from||'18:00'),allDone=(D.items||[]).length&&(D.items||[]).every(i=>done.has(i.id));
 if(now.min>=mf&&now.min<=mt&&!seen['am'+now.date]&&g.morning){seen['am'+now.date]=1;LS.set('seen',seen);const o=modal(`<div style="font-size:3rem">☀️</div><h3 style="white-space:pre-line;line-height:1.4">${esc(fill(g.morning))}</h3><button class="big" id="gt">See today's itinerary</button>`,true);o.querySelector('#gt').onclick=()=>{o.remove();ST.day=D.day;draw();$('#dayc').scrollIntoView({behavior:'smooth'})};return}
 if((now.min>=nf||allDone&&now.min>=tmin('15:00'))&&!seen['pm'+now.date]&&g.night&&D.day<d.booking.days){seen['pm'+now.date]=1;LS.set('seen',seen);modal(`<div style="font-size:3rem">🌙</div><h3 style="white-space:pre-line;line-height:1.45">${esc(fill(g.night))}</h3><button class="big" data-close>Good night!</button>`,true)}}

/* ---------- reminders while the app is open (phone app adds alarms when closed) ---------- */
setInterval(()=>{const d=ST.data;if(!d||!ST.tok)return;const now=tzParts(nowS()),seen=LS.get('seen',{}),done=new Set(d.done||[]);(d.days||[]).filter(x=>x.date===now.date&&!x.locked).forEach(x=>(x.items||[]).forEach(it=>{if(done.has(it.id))return;const dt=it.data||{},base=it.kind==='ferry'?tmin(dt.report||it.time):tmin(it.time);if(base==null||it.kind==='activity')return;(dt.rem||(it.kind==='ferry'?[60,30]:[30,15,5])).forEach(m=>{const k='r'+it.id+m;if(!seen[k]&&now.min>=base-m&&now.min<base){seen[k]=1;LS.set('seen',seen);notify(it.kind==='ferry'?`⛴️ Ferry reporting in ${base-now.min} min`:`🚕 Cab pickup in ${base-now.min} min`,it.kind==='ferry'?`Report at ${dt.reportAt||dt.harbour||''} by ${dt.report||it.time}`:`Wait at ${it.place||''} · ${dt.vehicle||''} ${dt.reg||''}`)}})}))},30000);

/* ---------- start ---------- */
async function boot(){if(!ST.tok){loginView();return}if(ST.data){draw()}const ok=await load();if(ok){draw();setTimeout(greetings,600)}else if(!ST.data)loginView()}
setTimeout(()=>{boot()},LS.get('tok',null)?1400:2300);
</script></body></html>
