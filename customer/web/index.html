<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Magic Memories — My Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--sea:#d63a6e;--sea2:#ff7a45;--lagoon:#ff9548;--vio:#7c4dff;--sand:#fff1e6;--sun:#f59e0b;--leaf:#12a150;--coral:#ef4444;--ink:#2a1420;--soft:#7a6470;--line:#f1dfe3;--card:#ffffff;--bg:#fff7f2;--r:22px;
 --grad:linear-gradient(125deg,#ff8a3d 0%,#ff4f7b 35%,#a646ff 70%,#ff8a3d 100%);--glow:rgba(255,79,123,.35);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fbe9ef;--soft:#c9a9b6;--line:#3a2230;--card:#22121c;--bg:#160b12;--sand:#2c1a12;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#fbe9ef;--soft:#c9a9b6;--line:#3a2230;--card:#22121c;--bg:#160b12;--sand:#2c1a12;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit}img{max-width:100%}
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.scr[hidden],[hidden]{display:none!important}
.fade-in{animation:fin .45s ease both}@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ag,.card.ag,.sh .ag{background:var(--grad);background-size:300% 300%;animation:gshift 14s ease-in-out infinite}
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx i{position:absolute;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.22);animation:rise linear infinite}
.fx i:nth-child(1){left:8%;width:26px;height:26px;animation-duration:11s}.fx i:nth-child(2){left:28%;width:14px;height:14px;animation-duration:8s;animation-delay:2s}.fx i:nth-child(3){left:52%;width:34px;height:34px;animation-duration:14s;animation-delay:1s}.fx i:nth-child(4){left:74%;width:18px;height:18px;animation-duration:9s;animation-delay:3s}.fx i:nth-child(5){left:90%;width:24px;height:24px;animation-duration:12s;animation-delay:5s}
@keyframes rise{from{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1}to{transform:translateY(-110vh) scale(1.1);opacity:0}}
.sunb{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.9) 0,rgba(255,200,90,.45) 40%,transparent 70%);top:-90px;right:-80px;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.85}}

/* splash */
#splash{color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.slogo{width:min(46vw,190px);aspect-ratio:1/1;border-radius:50%;background:#fff;padding:8px;box-shadow:0 18px 50px rgba(80,0,40,.4);animation:lpop 1s cubic-bezier(.2,.9,.3,1.3) both,bob 4s ease-in-out 1s infinite;position:relative;z-index:1}
.slogo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.slogo::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.6);animation:ring 1.8s ease-out .5s infinite}
@keyframes lpop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.28);opacity:0}}@keyframes bob{50%{transform:translateY(-8px)}}
.sname{font-weight:800;font-size:1.35rem;letter-spacing:.02em;animation:fin .6s .45s both;z-index:1;text-shadow:0 2px 12px rgba(80,0,40,.3)}.swel{opacity:.95;animation:fin .6s .7s both;z-index:1}
/* login */
#login{background:var(--bg)}
.lhead{color:#fff;text-align:center;padding:28px 20px 76px;position:relative;overflow:hidden}.lhead>:not(.fx):not(.sunb){position:relative}.lhead img{width:78px;height:78px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;box-shadow:0 8px 24px rgba(80,0,40,.3)}
.lhead h1{margin:8px 0 2px;font-size:1.2rem}.lhead p{margin:0;opacity:.9;font-size:.85rem}

.inp:focus{border-color:var(--sea)}
.pins{display:flex;gap:10px}.pins input{width:56px;height:60px;text-align:center;font-size:1.5rem;font-weight:800;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}.pins input:focus{border-color:var(--sea)}
.big{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:var(--grad);background-size:250% 250%;animation:gshift 8s ease-in-out infinite;color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 10px 26px var(--glow)}
.big:disabled{opacity:.6}.err{color:var(--coral);font-size:.86rem;margin-top:10px;min-height:1.2em}.hint{color:var(--soft);font-size:.78rem;margin-top:14px;text-align:center}

.wbtn{margin-top:22px;background:#fff;color:var(--sea);border:0;border-radius:999px;padding:13px 26px;font-weight:700;cursor:pointer}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;box-shadow:0 6px 20px rgba(120,20,60,.18)}
.top img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}.top b{flex:1;font-size:.95rem;line-height:1.15}.top small{display:block;font-weight:500;opacity:.9;font-size:.7rem}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib i{position:absolute;top:-2px;right:-2px;background:#fff;color:var(--sea);font-style:normal;font-size:.65rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.wrap{padding:14px 16px 120px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.hero .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85}.hero h2{margin:2px 0 8px;font-size:1.45rem}.hero .pk{font-weight:700;font-size:1.02rem}.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:.76rem;font-weight:600;backdrop-filter:blur(4px)}
.offline{background:#fef3c7;color:#78350f;border-radius:14px;padding:8px 12px;font-size:.8rem}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;scroll-snap-align:start;min-width:76px;border:0;border-radius:18px;padding:9px 12px;background:var(--card);box-shadow:0 3px 12px rgba(120,20,60,.08);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .25s,box-shadow .25s}
.dt b{font-size:.92rem}.dt small{font-size:.66rem;color:var(--soft)}.dt.on{background:var(--grad);background-size:250% 250%;animation:gshift 8s ease-in-out infinite;color:#fff;transform:translateY(-3px);box-shadow:0 10px 22px var(--glow)}.dt.on small{color:rgba(255,255,255,.9)}.dt.lk{opacity:.55}.dt.today::after{content:"TODAY";font-size:.55rem;font-weight:800;color:var(--sun);letter-spacing:.08em}.dt.on.today::after{color:#fff}
.dbar{display:flex;gap:8px;align-items:center}.ie{border:0;border-radius:999px;padding:9px 14px;background:var(--sand);color:#b4441c;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap}
.dhd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.dhd h3{margin:0;font-size:1.1rem}.dhd small{color:var(--soft)}

.tl{position:relative;margin-top:12px}.tl::before{content:"";position:absolute;left:21px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--sea2),var(--vio) 60%,var(--line))}
.ti{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:8px 0;animation:fin .45s ease both}
.tdot{width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--sea2);display:flex;align-items:center;justify-content:center;font-size:1.15rem;z-index:1;transition:all .3s}
.ti.done .tdot{background:var(--leaf);border-color:var(--leaf);color:#fff}.ti.now .tdot{border-color:var(--sea);box-shadow:0 0 0 6px var(--glow);animation:pulse 1.8s infinite}.ti.next .tdot{border-color:var(--vio)}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,79,123,0)}}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.ti.now .tc{border-color:var(--sea);box-shadow:0 8px 24px var(--glow)}.ti.done .tc{opacity:.8}
.tc img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover}
.tb{padding:12px 14px}.tt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ttime{font-weight:800;color:var(--sea);font-size:.9rem}.st{font-size:.66rem;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--soft)}.st.now{background:#ffe4ec;color:#a3164a}.st.done{background:#dcfce7;color:#166534}.st.next{background:#efe7ff;color:#5b21b6}
.tb h4{margin:4px 0 2px;font-size:1.02rem}.pl{color:var(--soft);font-size:.82rem}.ds{font-size:.86rem;margin:6px 0 0;line-height:1.5}.ins{margin-top:8px;font-size:.8rem;background:var(--sand);color:#b4441c;border-radius:12px;padding:7px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem;margin-top:8px}.kv span{color:var(--soft)}
.hl{display:flex;gap:8px;margin-top:10px}.hl div{flex:1;border-radius:14px;padding:8px 10px;text-align:center}.hl small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.hl b{font-size:1.15rem}
.hl .rep{background:#fff1d6;color:#92400e}.hl .dep{background:#efe7ff;color:#5b21b6}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ab{border:0;border-radius:999px;padding:8px 13px;font-weight:600;font-size:.8rem;cursor:pointer;background:var(--bg);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.ab.ok{background:var(--leaf);color:#fff}.ab.pri{background:var(--sea);color:#fff}
.lock{text-align:center;padding:30px 16px}.lock .lk{font-size:3rem;animation:shake 2.4s ease-in-out infinite}@keyframes shake{0%,90%,100%{transform:none}93%{transform:rotate(-10deg)}96%{transform:rotate(10deg)}}
.cd{display:flex;gap:8px;justify-content:center;margin-top:12px}.cd div{background:var(--bg);border-radius:14px;padding:8px 12px;min-width:62px}.cd b{display:block;font-size:1.3rem}.cd small{font-size:.65rem;color:var(--soft)}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.al:last-child{border-bottom:0}.al .ic{font-size:1.3rem}.al b{font-size:.9rem}.al p{margin:2px 0 0;font-size:.8rem;color:var(--soft)}
.remb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;background:linear-gradient(90deg,#fff1e6,#ffe4ec);color:#7a2140;border-radius:18px;padding:14px 14px;margin:6px 0 4px;box-shadow:inset 0 0 0 1px #ffd2dd}
.remb .ic{font-size:1.6rem}.remb b{display:block;font-size:.95rem}.remb small{font-size:.76rem;opacity:.85}.remb .ar{margin-left:auto;font-size:1.4rem;font-weight:800;animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}
.rl{margin:6px 0 0;padding:0;list-style:none}.rl li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}.rl li:last-child{border-bottom:0}.rl small{display:block;color:var(--soft);font-size:.78rem}
.rsec{border-radius:16px;padding:12px 14px;margin-top:12px}.rsec.d{background:#fff1e6;color:#6b2a10}.rsec.t{background:#f3ecff;color:#3b1d7a}.rsec h4{margin:0}
/* help desk — highlighted */
.help{color:#fff;position:relative;overflow:hidden;padding:18px;box-shadow:0 14px 34px var(--glow)}.help>:not(.fx){position:relative}
.help h3{margin:0 0 4px;font-size:1.25rem}.help p{white-space:pre-line;opacity:.95;font-size:.88rem;margin:6px 0 12px}
.hbad{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700;letter-spacing:.05em}.hbad::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:live 1.6s infinite}@keyframes live{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
.hc{display:grid;gap:8px}.hrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);color:#2a1420;border-radius:16px;padding:10px 12px;text-decoration:none}.hrow .hi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none;background:#ffe4ec}.hrow.wa .hi{background:#dcfce7}.hrow.em .hi{background:#efe7ff}
.hrow span{min-width:0}.hrow small{display:block;font-size:.7rem;color:#7a6470;font-weight:600;text-transform:uppercase;letter-spacing:.05em}.hrow b{font-size:.98rem;word-break:break-all;user-select:all}.hrow .go{margin-left:auto;font-weight:700;font-size:.78rem;color:var(--sea);white-space:nowrap}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:13px 18px;color:#fff;font-weight:700;box-shadow:0 10px 28px var(--glow);cursor:pointer;background:var(--grad);background-size:250% 250%;animation:gshift 8s ease-in-out infinite,fpulse 2.4s ease-in-out infinite}
@keyframes fpulse{50%{transform:scale(1.06)}}
/* sheets & modals */
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,6,20,.55);display:flex;align-items:flex-end;justify-content:center;animation:fo .2s both}@keyframes fo{from{opacity:0}}
.sh{width:100%;max-width:640px;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:su .32s cubic-bezier(.2,.9,.3,1) both}@keyframes su{from{transform:translateY(100%)}}
.sh h3{margin:0 0 4px}.x{float:right;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.mid{align-items:center;padding:20px}.mid .sh{border-radius:26px;text-align:center;max-width:420px}
/* greeting cards */
.gr .sh{padding:0;overflow:hidden;color:#fff}.gr .gin{position:relative;padding:34px 22px 24px}.gr .gin>:not(.fx){position:relative}
.gr.am .sh{background:linear-gradient(160deg,#ffb347,#ff6f61 55%,#ff4f7b)}.gr.pm .sh{background:linear-gradient(160deg,#1d1147,#4b1d6e 60%,#a1336b)}
.gr h3{white-space:pre-line;line-height:1.45;font-size:1.12rem}.gr .big{background:#fff;color:#a3164a;animation:none;box-shadow:none}
.sunr{width:86px;height:86px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle,#fff7c2,#ffd166 60%,#ffb347);box-shadow:0 0 40px 10px rgba(255,220,120,.7);animation:sunup 1.4s cubic-bezier(.2,.9,.3,1) both,breathe 5s ease-in-out 1.4s infinite}@keyframes sunup{from{transform:translateY(60px);opacity:0}}
.moon{width:80px;height:80px;margin:0 auto 6px;border-radius:50%;box-shadow:-18px 8px 0 4px #ffe9a8;transform:translateX(12px);animation:fin 1s both}
.stars2 i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.ies{display:grid;gap:12px;margin-top:12px}.ies ul{margin:6px 0 0;padding-left:20px}.ies li{margin:4px 0;font-size:.9rem}.inc{background:#f0fdf4;color:#14532d;border-radius:16px;padding:12px 14px}.exc{background:#fef2f2;color:#7f1d1d;border-radius:16px;padding:12px 14px}
.stars{display:flex;gap:6px;justify-content:center;margin:14px 0}.stars button{border:0;background:none;font-size:2.3rem;cursor:pointer;color:#e5d3da;transition:transform .15s}.stars button.on{color:#f59e0b}.stars button:active{transform:scale(1.25)}
.nt{padding:12px 0;border-bottom:1px solid var(--line)}.nt.new b::before{content:"● ";color:var(--sea)}.nt p{margin:3px 0 0;font-size:.85rem;white-space:pre-line}.nt small{color:var(--soft);font-size:.72rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#2a1420;color:#fff;padding:11px 18px;border-radius:14px;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px);animation:fin .3s both}
.upd{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;max-width:520px;margin:0 auto;border-radius:20px;padding:14px 16px;color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 14px 36px var(--glow);animation:su .4s cubic-bezier(.2,.9,.3,1) both}
.upd b{display:block}.upd small{opacity:.9;font-size:.78rem}.upd button{margin-left:auto;border:0;border-radius:999px;background:#fff;color:#a3164a;font-weight:800;padding:10px 14px;cursor:pointer;white-space:nowrap}
.chk{width:80px;height:80px;margin:0 auto}.chk circle{stroke:var(--leaf);stroke-width:4;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:dr .6s ease forwards}.chk path{stroke:var(--leaf);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .5s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.empty{text-align:center;color:var(--soft);padding:18px 8px;font-size:.88rem}
.menu{position:absolute;right:12px;top:58px;z-index:9;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:6px;min-width:220px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:.9rem}.menu button:hover{background:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head>
<body>
<div id="splash" class="scr ag"><div class="fx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="sunb" aria-hidden="true"></div><div class="slogo"><img id="lg1" alt="Magic Memories Tours and Travels logo"></div><div class="sname">Magic Memories Tours and Travels</div><div class="swel">Welcome Our Valuable Customer</div><div class="sea" aria-hidden="true"></div></div>
<div id="login" class="scr" hidden></div>
<div id="welcome" class="scr ag" hidden></div>
<div id="home" class="scr" hidden></div>
<div id="layer"></div>

async function rpc(fn,args,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);try{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{}),signal:c.signal});if(!r.ok){let m='Server error '+r.status;try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}return await r.json()}finally{clearTimeout(t)}}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
function show(id){['splash','login','welcome','home'].forEach(s=>$('#'+s).hidden=s!==id)}
const first=n=>String(n||'').replace(/\(.*?\)/g,'').trim().split(/\s+/)[0]||'';
/* ---- time in the tour's time zone, from SERVER time (never the phone clock) ---- */
const TZ=()=>(ST.data&&ST.data.booking&&ST.data.booking.tz)||'Asia/Kolkata';
const nowS=()=>new Date(Date.now()+ST.skew);
function tzParts(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return {date:o.year+'-'+o.month+'-'+o.day,min:(+o.hour%24)*60+ +o.minute,h:+o.hour%24}}
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(String(t||''));if(!m)return null;let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h*60+ +m[2]};
const durMin=s=>{s=String(s||'').toLowerCase();let m=0;const h=/(\d+(?:\.\d+)?)\s*h/.exec(s),mi=/(\d+)\s*m/.exec(s);if(h)m+=parseFloat(h[1])*60;if(mi)m+=+mi[1];return m||60};
const fdate=(iso,o)=>new Date(iso+'T00:00').toLocaleDateString('en-GB',o||{weekday:'short',day:'2-digit',month:'short'});

function loginView(err){show('login');$('#login').innerHTML=`<div class="lhead ag fade-in">${FX}<div class="sunb" aria-hidden="true"></div><img src="${LOGO}" alt=""><h1>Magic Memories Tours and Travels</h1><p>Your personal tour companion</p></div>
 <form class="lcard fade-in" id="lf" novalidate><h2 style="margin:0 0 4px;font-size:1.2rem">Open my tour</h2><p style="margin:0;color:var(--soft);font-size:.85rem">Enter the Booking ID sent to you by Magic Memories.</p>
 <label class="lbl" for="bid">Booking ID</label><input class="inp" id="bid" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MM-XXXXXX" maxlength="12" value="${esc(LS.get('lastCode',''))}">
 <label class="lbl" id="pinl">Last 4 digits of your mobile number</label><div class="pins" role="group" aria-labelledby="pinl">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-p="${i}" autocomplete="off">`).join('')}</div>
 <div class="err" id="lerr" role="alert">${esc(err||'')}</div><button class="big" id="lgo" type="submit">Open my tour →</button>
 <div class="hint">🔒 Your details are private — only you can see your booking.</div></form>`;
 const P=[...document.querySelectorAll('[data-p]')];P.forEach((p,i)=>{p.addEventListener('input',()=>{p.value=p.value.replace(/\D/g,'').slice(-1);if(p.value&&P[i+1])P[i+1].focus()});p.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!p.value&&P[i-1])P[i-1].focus()})});
 $('#lf').addEventListener('submit',async e=>{e.preventDefault();const code=$('#bid').value.trim().toUpperCase(),pin=P.map(p=>p.value).join('');if(code.replace(/^MM-/,'').length<6){$('#lerr').textContent='Enter your full Booking ID';return}if(pin.length!==4){$('#lerr').textContent='Enter the last 4 digits of your mobile number';return}
  const b=$('#lgo');b.disabled=true;b.textContent='Checking…';$('#lerr').textContent='';
  try{const r=await rpc('mmc_login',{p_code:code,p_verify:pin,p_device:(navigator.userAgent||'').slice(0,60)});if(!r||!r.ok){$('#lerr').textContent=(r&&r.err)||'Could not open the booking';b.disabled=false;b.textContent='Open my tour →';return}
   ST.tok=r.token;LS.set('tok',r.token);LS.set('lastCode',code);ST.data=null;LS.del('data');LS.set('seen',{});welcomeView(r.name)}
  catch(x){$('#lerr').textContent=navigator.onLine?'Could not reach the server. Please try again.':'No internet connection. Connect and try again.';b.disabled=false;b.textContent='Open my tour →'}});}
function welcomeView(name){show('welcome');$('#welcome').innerHTML=`${FX}<div class="fade-in"><div class="wv" aria-hidden="true">👋</div><h1>Welcome, ${esc(first(name))}!</h1><p>We're delighted to have you with us.</p><p style="font-weight:700;font-size:1.1rem;margin-top:10px">Your Journey Begins Here!</p><button class="wbtn" id="wgo">Open my tour</button></div>`;const go=()=>{clearTimeout(t);boot()};const t=setTimeout(go,3200);$('#wgo').onclick=go}

/* ---------- data ---------- */
async function load(silent){if(!ST.tok){loginView();return false}
 try{const d=await rpc('mmc_data',{p_token:ST.tok});if(!d||!d.ok){if(d&&d.err==='session'){logout(true,'Your session has ended. Please open your booking again.');return false}throw new Error('bad')}
  const prev=ST.data;ST.skew=new Date(d.now)-Date.now();ST.data=d;ST.at=Date.now();ST.offline=false;LS.set('data',d);LS.set('at',ST.at);
  if(prev&&prev.unlocked<d.unlocked&&d.unlocked>0){notify('🌅 Day '+d.unlocked+' is now available',`Good Morning! Day ${d.unlocked} of your ${d.booking.package||'tour'} is now available. Open to explore today's schedule.`);ST.day=d.unlocked}
  if(prev){const old=new Set((prev.notifs||[]).map(n=>n.id));(d.notifs||[]).filter(n=>!old.has(n.id)).forEach(n=>notify(n.title,n.body))}
  return true}catch(e){ST.offline=true;if(!silent&&!ST.data)toast('No connection — showing saved information');return !!ST.data}}
function notify(t,b){toast(t);try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(t,{body:b||'',icon:LOGO})}catch(e){}}
async function poll(){if(!ST.tok||document.hidden)return;try{const v=await rpc('mmc_ver',{p_token:ST.tok},8000);if(v==='session'){logout(true,'Your session has ended. Please open your booking again.');return}if(v!==ST.ver){const f0=!ST.ver;ST.ver=v;if(!f0){await load(true);draw()}}ST.offline=false}catch(e){if(!ST.offline){ST.offline=true;draw()}}}
setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ST.tok){load(true).then(ok=>{if(ok)draw();greetings()})}});
window.addEventListener('online',()=>{if(ST.tok)load(true).then(()=>draw())});window.addEventListener('offline',()=>{ST.offline=true;draw()});

setInterval(()=>{const d=ST.data;if(!d||!ST.tok)return;const now=tzParts(nowS()),seen=LS.get('seen',{}),done=new Set(d.done||[]);(d.days||[]).filter(x=>x.date===now.date&&!x.locked).forEach(x=>(x.items||[]).forEach(it=>{if(done.has(it.id))return;const dt=it.data||{},base=it.kind==='ferry'?tmin(dt.report||it.time):tmin(it.time);if(base==null||it.kind==='activity')return;(dt.rem||(it.kind==='ferry'?[60,30]:[30,15,5])).forEach(m=>{const k='r'+it.id+m;if(!seen[k]&&now.min>=base-m&&now.min<base){seen[k]=1;LS.set('seen',seen);notify(it.kind==='ferry'?`⛴️ Ferry reporting in ${base-now.min} min`:`🚕 Cab pickup in ${base-now.min} min`,it.kind==='ferry'?`Report at ${dt.reportAt||dt.harbour||''} by ${dt.report||it.time}`:`Wait at ${it.place||''} · ${dt.vehicle||''} ${dt.reg||''}`)}})}))},30000);

/* ---------- start ---------- */
async function boot(){if(!ST.tok){loginView();return}if(ST.data){draw()}const ok=await load();if(ok){draw();setTimeout(()=>greetings(true),700)}else if(!ST.data)loginView()}
setTimeout(()=>{boot()},LS.get('tok',null)?1400:2300);
</script></body></html>
