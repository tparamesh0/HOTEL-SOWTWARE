<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MM TravelMate</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2933;--soft:#6b7280;--line:#e5e7eb;--acc:#0f766e;--acc2:#e6f4f1;--amb:#b45309;--amb2:#fef3c7;--ok:#15803d;--ok2:#dcfce7;--bad:#b91c1c;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1214;--card:#1a1f23;--ink:#e5e7eb;--soft:#9ca3af;--line:#2a3036;--acc:#2dd4bf;--acc2:#12302c;--amb:#fbbf24;--amb2:#33280f;--ok:#4ade80;--ok2:#11301d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1214;--card:#1a1f23;--ink:#e5e7eb;--soft:#9ca3af;--line:#2a3036;--acc:#2dd4bf;--acc2:#12302c;--amb:#fbbf24;--amb2:#33280f;--ok:#4ade80;--ok2:#11301d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}img{max-width:100%;display:block}a{color:inherit}
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.fi{animation:fin .28s ease-out both}
/* splash / login / welcome */
#splash,#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;background:var(--card)}
.lg{width:112px;height:112px;border-radius:24%;object-fit:contain;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08);animation:pop .4s ease-out both}
.ttl{font-weight:700;font-size:17px;margin:4px 0 0}.sub{color:var(--soft);font-size:13px;margin:0}
#login{background:var(--card)}
.lw{max-width:420px;margin:0 auto;padding:48px 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.lf{width:100%;margin-top:22px;text-align:left}
.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.inp{width:100%;font:inherit;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc);background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--acc);color:#fff;text-decoration:none;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}.btn.w{width:100%;margin-top:14px;font-size:15px}
.btn.o{background:var(--card);color:var(--acc);border:1.5px solid var(--line)}.btn.s{padding:8px 12px;font-size:13px;border-radius:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.hint{color:var(--soft);font-size:12px;margin-top:16px;text-align:center}
#welcome h1{font-size:22px;margin:6px 0 0}
/* home */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.top img{width:34px;height:34px;border-radius:24%;object-fit:contain;background:#fff}.top b{flex:1;font-size:14px;line-height:1.2}.top small{display:block;font-weight:400;color:var(--soft);font-size:11px}
.ib{position:relative;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:16px;display:flex;align-items:center;justify-content:center}
.ib i{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 90px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.trip h2{margin:0;font-size:17px}.trip .pk{font-size:13px;color:var(--soft);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.meta span{font-size:12px;background:var(--bg);border-radius:8px;padding:3px 8px}
.offl{background:var(--amb2);color:var(--amb);border-radius:10px;padding:8px 12px;font-size:12px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.days::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;text-align:center;line-height:1.25;transition:background .15s,color .15s,border-color .15s}
.dt b{display:block;font-size:13px}.dt small{font-size:11px;color:var(--soft)}
.dt.on{background:var(--acc);border-color:var(--acc);color:#fff}.dt.on small{color:rgba(255,255,255,.85)}.dt.lk{opacity:.55}
.dt.today:not(.on){border-color:var(--acc)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;font-weight:600}
.qb span{flex:1;min-width:0}.qb small{display:block;font-weight:400;color:var(--soft);font-size:11px}.qb .ar{flex:none;color:var(--soft);font-size:16px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.dh h3{margin:0;font-size:16px}.dh small{color:var(--soft);font-size:12px;white-space:nowrap}
.dsub{color:var(--soft);font-size:12px}
.pb{height:4px;border-radius:4px;background:var(--line);margin:10px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .5s ease}
.slide{animation:fin .25s ease-out both}
/* timeline */
.it{display:grid;grid-template-columns:62px 16px minmax(0,1fr);column-gap:8px;position:relative}
.it .tm{font-weight:700;font-size:12.5px;padding-top:10px;text-align:right;white-space:nowrap}
.rail{position:relative;display:flex;justify-content:center}.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.it:first-child .rail::before{top:16px}.it:last-child .rail::before{bottom:calc(100% - 16px)}
.dot{position:relative;margin-top:12px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--soft)}
.it.done .dot{background:var(--ok);border-color:var(--ok)}.it.now .dot{border-color:var(--acc);background:var(--acc);box-shadow:0 0 0 4px var(--acc2)}.it.next .dot{border-color:var(--acc)}
.ib2{border:0;background:none;text-align:left;width:100%;padding:8px 0 10px;display:block}
.it:not(:last-child) .body{border-bottom:1px solid var(--line)}.ib2:disabled{cursor:default;opacity:1}
.ih{display:flex;gap:8px;align-items:flex-start}.ih .tx{flex:1;min-width:0}.ih b{font-size:14px;display:block}
.ih .pl{color:var(--soft);font-size:12px}.chev{color:var(--soft);transition:transform .2s;margin-top:1px}.open .chev{transform:rotate(90deg)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:2px 6px;background:var(--bg);color:var(--soft);white-space:nowrap}
.pill.now{background:var(--acc2);color:var(--acc)}.pill.done{background:var(--ok2);color:var(--ok)}.pill.next{background:var(--amb2);color:var(--amb)}
.key{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.key span{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--amb2);color:var(--amb);font-weight:600}.key span.b{background:var(--acc2);color:var(--acc)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}.open .det{grid-template-rows:1fr}.det>div{overflow:hidden}
.det .in{padding:0 0 10px}
.det img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--bg);margin-bottom:8px}
.det p{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:4px 0 6px}.kv span{color:var(--soft)}
.ins{font-size:12.5px;background:var(--amb2);color:var(--amb);border-radius:8px;padding:6px 9px;margin:4px 0 6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lock{text-align:center;padding:22px 10px}.lock .e{font-size:30px}.lock h3{margin:6px 0 2px;font-size:16px}.lock p{margin:0;color:var(--soft);font-size:13px}
.cd{display:inline-flex;gap:6px;margin-top:10px}.cd div{background:var(--bg);border-radius:8px;padding:6px 10px;min-width:54px}.cd b{display:block;font-size:16px}.cd small{font-size:10px;color:var(--soft)}
.empty{text-align:center;color:var(--soft);padding:14px 6px;font-size:13px}
.sec{margin:0 0 6px;font-size:14px}
.al{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.al:first-of-type{border-top:0}.al p{margin:1px 0 0;color:var(--soft);font-size:12px}
.hb{display:grid;gap:8px;margin-top:10px}.hb .btn{padding:10px 6px;font-size:13px}
.ls{margin-top:8px;font-size:12px;color:var(--soft);line-height:1.7;user-select:text}
.hbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok)}.hbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:10px 16px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fo .15s both}@keyframes fo{from{opacity:0}}
.sh{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:su .22s ease-out both}@keyframes su{from{transform:translateY(40px);opacity:0}}
.sh h3{margin:0 0 4px;font-size:16px}.x{float:right;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%}
.mid{align-items:center;padding:20px}.mid .sh{border-radius:18px;text-align:center;max-width:380px;animation:pop .22s ease-out both}
.grp{border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--bg)}.grp h4{margin:0 0 4px;font-size:13px}.grp ul{margin:0;padding-left:18px}.grp li{margin:4px 0;font-size:13px}.grp li small{display:block;color:var(--soft)}
.grp.in{background:var(--ok2)}.grp.ex{background:#fdecec;color:#7f1d1d}
.ge{font-size:40px;line-height:1;animation:pop .4s ease-out both}.gt{white-space:pre-line;font-size:15px;line-height:1.5;margin:10px 0 4px}
.stars{display:flex;gap:4px;justify-content:center;margin:10px 0}.stars button{border:0;background:none;font-size:30px;color:#d1d5db;transition:transform .12s}.stars button.on{color:#f59e0b}.stars button:active{transform:scale(1.2)}
textarea.ta{width:100%;border-radius:10px;border:1.5px solid var(--line);padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.nt{padding:10px 0;border-bottom:1px solid var(--line)}.nt:last-child{border-bottom:0}.nt.new b::before{content:"● ";color:var(--bad)}.nt p{margin:2px 0;font-size:13px;white-space:pre-line}.nt small{color:var(--soft);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#1f2933;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100vw - 32px);animation:fin .2s both}
.upd{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;max-width:480px;margin:0 auto;border-radius:14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;gap:10px;align-items:center;animation:su .25s ease-out both}
.upd b{display:block;font-size:13px}.upd small{color:var(--soft);font-size:12px}.upd .btn{margin-left:auto;white-space:nowrap}
.chk{width:64px;height:64px;margin:0 auto}.chk circle{stroke:var(--ok);stroke-width:4;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:dr .45s ease forwards}.chk path{stroke:var(--ok);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .3s .35s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.menu{position:absolute;right:10px;top:50px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:200px;animation:pop .15s ease-out both}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:13px}.menu button:active{background:var(--bg)}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:middle}.live.off{background:var(--soft)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* done button beside each event */
.dn{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.dn:active{transform:scale(.94)}.dn.on{background:var(--ok);border-color:var(--ok);color:#fff}.dn.next{border-color:var(--acc);color:var(--acc)}
.st2{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:3px}.st2.now{background:var(--acc2);color:var(--acc)}.st2.next{background:var(--amb2);color:var(--amb)}
/* instant message alert */
.alrt{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;max-width:520px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);border:1px solid var(--line);overflow:hidden;animation:adown .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes adown{from{transform:translateY(-120%);opacity:0}}.alrt.out{transition:transform .3s,opacity .3s;transform:translateY(-120%);opacity:0}
.alrt .ah{display:flex;align-items:center;gap:8px;background:var(--acc);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em}
.alrt .ab2{padding:12px 16px 14px}.alrt h4{margin:0 0 4px;font-size:17px;line-height:1.3}.alrt p{margin:0;font-size:15px;line-height:1.5;white-space:pre-line}
.alrt .bar{height:3px;background:var(--acc);transform-origin:left;animation:abar 7s linear forwards}@keyframes abar{to{transform:scaleX(0)}}
.alrt.night .ah{background:#3b2d7a}
.perm{display:flex;gap:10px;align-items:center;background:var(--acc2);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}.perm .btn{margin-left:auto;white-space:nowrap}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));z-index:7;transform:translate(-50%,-140px);opacity:0;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--acc);transition:transform .2s}
.ptr.vis{opacity:1}.ptr.spin span{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.closed{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:30px 24px;min-height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style></head>
<body>
<div id="splash" class="scr"><img class="lg" id="lg1" alt="MM TravelMate logo"><p class="ttl">MM TravelMate</p><p class="sub">by Magic Memories Tours and Travels</p><p class="sub" style="margin-top:8px">Welcome Our Valuable Customer</p></div>
<div id="login" class="scr" hidden></div>
<div id="welcome" class="scr" hidden></div>
<div id="home" class="scr" hidden></div>
<div id="layer"></div>

function tripDone(d){const days=d.days||[],done=new Set(d.done||[]),today=tzParts(nowS()).date,last=days[days.length-1];if(!last||(d.feedback||{})[0])return false;
 const all=days.every(x=>!x.locked)&&days.some(x=>(x.items||[]).length)&&days.every(x=>(x.items||[]).every(i=>done.has(i.id)));return all||today>last.date}

 const o=modal(`<div class="ge" aria-hidden="true">🎉</div><h3 style="margin-top:8px;font-size:18px">Congratulations, ${esc(nm)}!</h3><p class="gt" style="font-size:14px">All your tour events are completed.

 o.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stars=+b.dataset.s;o.querySelectorAll('[data-s]').forEach(x=>{x.classList.toggle('on',+x.dataset.s<=stars);x.setAttribute('aria-checked',+x.dataset.s===stars)})});
 o.querySelector('#fbs').onclick=async()=>{if(!stars){toast('Tap the stars to rate');return}try{const r=await rpc('mmc_feedback_save',{p_token:ST.tok,p_day:day,p_stars:stars,p_comment:o.querySelector('#fbc').value});if(!r.ok)throw 0;(ST.data.feedback=ST.data.feedback||{})[day]={stars};LS.set('data',ST.data);o.remove();toast('Thank you for your feedback!')}catch(e){toast('Could not send — please try again')}}}
let gLast=0;
function greetCard(emoji,text,btn,onbtn){const o=modal(`<div class="ge" aria-hidden="true">${emoji}</div><p class="gt">${esc(text)}</p><button class="btn w" id="gbtn">${btn}</button>`,true);o.querySelector('#gbtn').onclick=()=>{o.remove();onbtn&&onbtn()}}
function greetings(force){const d=ST.data;if(!d||document.querySelector('.ov'))return;if(tripDone(d)&&tripReview())return;if(!d.unlocked)return;if(!force&&Date.now()-gLast<15*60000)return;
 const g=d.greet||{},now=tzParts(nowS()),seen=LS.get('seen',{}),days=d.days||[],D=days.find(x=>x.date===now.date&&!x.locked),done=new Set(d.done||[]),last=days[days.length-1];
 const prev=days.filter(x=>!x.locked&&x.date<now.date&&(x.items||[]).length&&(x.items||[]).every(i=>done.has(i.id))&&!(d.feedback||{})[x.day]).pop();
 if(prev&&!seen['fb'+prev.day]&&g.fb_on!==false){gLast=Date.now();feedback(prev.day,true);return}
 const mf=tmin(g.morning_from||'05:00'),mt=tmin(g.morning_to||'11:59'),nf=tmin(g.night_from||'18:00'),am=now.min>=mf&&now.min<=mt,pm=now.min>=nf||now.min<mf;
 if(am&&D&&g.morning&&g.am_on!==false){gLast=Date.now();greetCard('☀️',fill(g.morning),"See today's plan",()=>{ST.day=D.day;draw()});return}
 if(false){const yest=fdIso(now.date,-1),onTour=days.some(x=>x.date===now.date)||(now.min<mf&&last&&last.date>=yest);if(!onTour)return;
  const isLast=last&&(last.date===now.date||(now.min<mf&&last.date===yest));
  gLast=Date.now();greetCard('🌙',isLast?`Good Night, ${first(d.booking.passenger)}!\nHope you had a wonderful trip with us!\nThank you for travelling with Magic Memories Tours and Travels.`:fill(g.night||'Good Night, {name}!\nSee You Tomorrow!'),'Good night')}}

/* ---------- automatic updates ---------- */
const CBUILD=+'7',REMOTE='https://magic-memories-customer.vercel.app/',IS_APP=location.hostname==='localhost',VER_URL=(IS_APP||location.protocol!=='https:'?REMOTE:'/')+'version.json';
async function checkUpdate(){try{const r=await fetch(VER_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();if(!(v.build>CBUILD)||$('.upd'))return;
 if(!ST.tok||$('#home').hidden){applyUpdate(v.build);return}
 const u=document.createElement('div');u.className='upd';u.setAttribute('role','status');u.innerHTML=`<span aria-hidden="true">🎉</span><span><b>New update available</b><small>${esc(v.notes||'Improvements to your tour app')}</small></span><button class="btn s" id="updb">Update now</button>`;document.body.appendChild(u);u.querySelector('#updb').onclick=()=>applyUpdate(v.build)}catch(e){}}
async function applyUpdate(b){if(!IS_APP){location.replace(location.pathname+'?v='+b);return}
 try{toast('Updating…');const r=await fetch(REMOTE+'index.html?b='+b+'&t='+Date.now(),{cache:'no-store'});const h=await r.text();if(!r.ok||h.indexOf("CBUILD=+'"+b+"'")<0)throw 0;localStorage.setItem('mmc.ota.h',h);localStorage.setItem('mmc.ota.b',String(b));location.reload()}catch(e){toast('Update could not download — it will try again later')}}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,30*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ---------- phone alarms: ferry, pickup and new-day reminders even when the app is closed ---------- */
function tzMs(date,t){const m=tmin(t);if(m==null)return null;const off=TZ()==='Asia/Kolkata'?'+05:30':'';return Date.parse(date+'T'+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':00'+off)}
let alarmSig='';
async function phoneAlarms(){const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications,d=ST.data;if(!LN||!d)return;
 try{const L=[],done=new Set(d.done||[]),now=Date.now()+ST.skew;let id=1000;
  (d.days||[]).filter(x=>!x.locked).forEach(x=>(x.items||[]).forEach(it=>{if(done.has(it.id)||it.kind==='activity')return;const dt=it.data||{},base=tzMs(x.date,it.kind==='ferry'?(dt.report||it.time):it.time);if(!base)return;
   (dt.rem||(it.kind==='ferry'?[60,30]:[30,15,5])).forEach(m=>{const at=base-m*60000;if(at>now+30000)L.push({id:id++,title:it.kind==='ferry'?`⛴️ Ferry reporting in ${m} min`:`🚕 Cab pickup in ${m} min`,body:it.kind==='ferry'?`Report at ${dt.reportAt||dt.harbour||'the harbour'} by ${dt.report||it.time}`:`Wait at ${it.place||''}${dt.vehicle?' · '+dt.vehicle+' '+(dt.reg||''):''}`,schedule:{at:new Date(at-ST.skew),allowWhileIdle:true}})})}));
  if(d.next_unlock){const at=new Date(d.next_unlock).getTime();if(at>now)L.push({id:999,title:'🌅 Good Morning!',body:`Day ${d.unlocked+1} of your tour is now open. Tap to see today's plan.`,schedule:{at:new Date(at-ST.skew+60000),allowWhileIdle:true}})}
  const sig=JSON.stringify(L.map(x=>[x.id,x.title,+x.schedule.at]));if(sig===alarmSig)return;
  let p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();if(p.display!=='granted')return;
  const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  if(L.length)await LN.schedule({notifications:L.slice(0,60)});alarmSig=sig}catch(e){}}

/* ---------- start: show the saved tour instantly, refresh in the background ---------- */
async function boot(){if(!ST.tok){loginView();return}if(ST.data){draw();rtStart()}const ok=await load(!!ST.data);if(ok){draw();rtStart();setTimeout(()=>greetings(true),400);phoneAlarms()}else if(!ST.data)loginView()}
if(ST.tok&&ST.data)boot();else setTimeout(boot,ST.tok?300:900);
