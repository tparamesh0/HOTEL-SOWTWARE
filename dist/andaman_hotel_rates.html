:root{--bg:#f8f9fa;--side:#ffffff;--card:#ffffff;--text:#202124;--soft:#5f6368;--line:#e6e9ec;--main:#1a73e8;--onmain:#ffffff;--mainsoft:#e8f0fe;--accent:#fbbc04;--onaccent:#202124;--ok:#34a853;--warn:#f9ab00;--bad:#d93025;--star:#f9ab00;--r:20px;--fh:'Poppins',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif;--shadow:0 1px 2px rgba(60,64,67,.14),0 2px 8px rgba(60,64,67,.07)}

function lum(hex){const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)}

 return `<div class="row" style="justify-content:space-between"><h3>${ready?'✅':'📝'} Ready to ${mode==='new'?'submit':'save'}?</h3><span class="tag ${ready?'y':'w'}" style="white-space:nowrap">${done} of ${c.req.length} done</span></div><p class="mini" style="margin:8px 0 10px;line-height:1.5">A to-do list for this form. Each line turns <b style="color:var(--ok)">green</b> when you fill it. When all <b>required</b> lines are green you are ready. If you press ${mode==='new'?'Submit':'Save'} too early, it lists exactly what to fix. “Optional” lines can stay empty.</p><div class="lbl">Required</div>${c.req.map(x=>ln(x)).join('')}<div class="lbl" style="margin-top:10px">Optional</div>${c.opt.map(x=>ln(x,1)).join('')}<div class="alert ${ready?'ok':''}" style="margin:12px 0 0;padding:10px 14px;font-size:.85rem;font-weight:600;justify-content:center;text-align:center">${ready?'All required items done — you can '+(mode==='new'?'submit':'save'):'Still needed: '+c.req.filter(x=>!x[1]).map(x=>x[0].toLowerCase()).join(', ')}</div>`}
function refreshStatus(){const a=$('#chk'),b=$('#sum');if(!D)return;const mode=UI.page==='new'?'new':'edit';if(a)a.innerHTML=checklistHTML(D,mode);if(b)b.innerHTML=summaryHTML(D,mode);if(UI.errs){UI.errs=validate(D,mode);if(!UI.errs.length)UI.errs=null;const eb=$('#errbox');if(eb)eb.innerHTML=errHTML();markErrs()}}
function formHTML(mode){const m=D,combo=(path,val,opts,ph,tt)=>`<div class="combo"><input type="text" data-m="${path}" data-dd="1" value="${esc(val)}" placeholder="${ph}" autocomplete="off" ${tt?`style="text-transform:${tt}"`:''}><button type="button" class="ddb" data-a="ddToggle" aria-label="Show list">▾</button><div class="ddp" hidden>${opts.map(o=>`<button type="button" class="ddi" data-a="ddPick" data-p="${path}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`,fld=(l,inner)=>`<div><div class="lbl">${l}</div>${inner}</div>`,req='<span style="color:var(--bad)">*</span> ';
 const sec=(n,t,hint,inner)=>`<div class="card"><div class="row" style="flex-wrap:nowrap;margin-bottom:14px"><span class="badge">${n}</span><div><h3 style="font-size:1.05rem">${t}</h3><div class="mini">${hint}</div></div></div>${inner}</div>`;
 const plans=S.set.plans.map(p=>`<button class="planpill ${m.plansOn.includes(p.code)?'on':''}" style="--c:${p.color}" data-a="planOn" data-k="${esc(p.code)}">${m.plansOn.includes(p.code)?'✓ ':''}${esc(p.code)} <small>${esc(p.meaning||p.name)}</small></button>`).join('')+`<button class="planpill" style="--c:var(--main);border-style:dashed" data-a="togAddPlan">＋ Add plan type</button>`;
 const ap=UI.addPlan?`<div class="card" style="background:color-mix(in srgb,#9334e6 12%,var(--card));box-shadow:none;margin:14px 0"><b>Add a new plan type</b> <span class="mini">— saved in Settings → Plan types for every hotel</span><div class="grid" style="grid-template-columns:100px minmax(0,1fr) minmax(0,1fr) auto auto;gap:10px;align-items:end;margin-top:10px">${fld('Short code','<input id="apCode" type="text" placeholder="SP1" maxlength="6">')}${fld('Full name','<input id="apName" type="text" placeholder="Honeymoon Package">')}${fld('Meaning (optional)','<input id="apMean" type="text" placeholder="Special package">')}${fld('Colour','<input id="apCol" type="color" value="#9334e6">')}<button class="btn" data-a="addPlan" style="background:#9334e6">Add</button></div></div>`:'';
 const cols=S.set.plans.filter(p=>m.plansOn.includes(p.code));
 const rooms=`<div class="tw"><table><tr><th></th><th></th><th colspan="${Math.max(cols.length,1)}" style="text-align:center;background:var(--accent);color:var(--onaccent);border-radius:14px">RATES PER NIGHT (₹) — enter the price for each plan</th><th></th></tr><tr><th>ROOM CATEGORY</th><th class="n">TOTAL ROOMS</th>${cols.map(p=>`<th class="n" style="color:${p.built?'':p.color}">${esc(p.code)}</th>`).join('')}<th></th></tr>${m.rooms.map((r,i)=>`<tr><td style="min-width:240px">${combo('rooms.'+i+'.category',r.category,S.set.rooms,'e.g. DELUXE ROOM')}</td><td style="width:90px"><input type="number" data-m="rooms.${i}.total" data-n="1" value="${esc(r.total)}"></td>${cols.map(p=>`<td style="width:105px"><input type="number" data-m="rooms.${i}.p.${esc(p.code)}" data-n="1" value="${r.p&&r.p[p.code]!=null?esc(r.p[p.code]):''}" placeholder="—"></td>`).join('')}<td><button class="btn ghost sm" data-a="delRoom" data-k="${i}" aria-label="Delete room">🗑</button></td></tr>`).join('')}</table></div><div style="margin-top:12px"><button class="btn ghost sm" data-a="addRoom">+ Add room category</button> <span class="mini">leave a plan empty if the hotel does not offer it</span></div>`;
const adds=`${m.addons.map((a,i)=>`<div class="grid addrow" style="grid-template-columns:minmax(0,1fr) 140px 44px;gap:10px;margin-bottom:8px">${combo('addons.'+i+'.item',a.item,S.set.addons.map(x=>x.item),'Item (type, or tap ▾ to pick)',TT[S.set.textCase.addon])}<input type="number" min="0" data-m="addons.${i}.rate" data-n="1" value="${esc(a.rate)}" placeholder="₹ rate"><button class="btn ghost sm" data-a="delAdd" data-k="${i}" aria-label="Delete item">🗑</button></div>`).join('')}<button class="btn ghost sm" data-a="addAdd">+ Add item</button>`;
 const facs=`<div class="grid g4" style="gap:10px">${S.set.facilities.map(f=>`<button class="fac ${m.fac.includes(f.id)?'on':''}" data-a="facTog" data-k="${f.id}" role="checkbox" aria-checked="${m.fac.includes(f.id)}"><span class="bx">${m.fac.includes(f.id)?'✓':''}</span><span><b style="font-weight:600">${f.icon} ${esc(f.name)}</b>${f.list?`<br><span class="mini">Goes to the ${esc(f.name)} list</span>`:''}</span></button>`).join('')}</div><p class="mini" style="margin-top:12px">Add or remove facilities in Settings → Facilities.</p>`;
 const multi=(key,label,ph,addAct,delAct,reqd)=>`<div><div class="lbl">${reqd?req:''}${label}${m[key].length>1?'s':''}</div>${m[key].map((v,i)=>`<div class="row" style="flex-wrap:nowrap;gap:8px;margin-bottom:8px"><input type="text" data-m="${key}.${i}" value="${esc(v)}" placeholder="${ph}${m[key].length>1?' '+(i+1):''}" style="flex:1;min-width:0">${m[key].length>1?`<button class="btn ghost sm" data-a="${delAct}" data-k="${i}" aria-label="Remove this one">✕</button>`:''}${i===m[key].length-1?`<button class="btn sm" data-a="${addAct}" aria-label="Add another" title="Add another">＋</button>`:''}</div>`).join('')}</div>`;
 const isl=`<select data-m="island" data-re="1">${S.set.islands.map(i=>`<option ${m.island===i.name?'selected':''}>${esc(i.name)}</option>`).join('')}</select>`,cl=`<select data-m="tier"><option value="">Choose class…</option>${S.set.classes.map(c=>`<option ${m.tier===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`,st=`<select data-m="star"><option value="">No star</option>${[5,4,3,2,1].map(s=>`<option value="${s}" ${m.star==s?'selected':''}>${s} ★</option>`).join('')}</select>`;
 const intro=mode==='new'?`<div class="alert info"><span>📝</span><div><b>Fill everything on this one page</b>, top to bottom. Boxes marked <span style="color:var(--bad)">*</span> are required. The checklist shows what is still missing.</div></div>`:`<div class="alert"><span>✏️</span><div style="flex:1"><b>Editing: ${esc(m.name)}</b><div class="mini">Nothing is saved until you press Save changes.</div></div></div>`;
 return intro+`<div id="errbox">${errHTML()}</div>`+`<div class="grid gm2" style="align-items:start"><div class="grid">${sec(1,'Island, class and star','Decides which island, class and star list this hotel goes into',`<div class="grid g3">${fld(req+'Island',isl)}${fld(req+'Class',cl)}${fld('Star',st)}</div>`)}${sec(2,'Hotel name & personal ID','Same as the top of every hotel sheet',`${fld(req+'Hotel name',`<input id="fName" type="text" style="text-transform:${TT[S.set.textCase.hotel]}" data-m="name" value="${esc(m.name)}" placeholder="HOTEL NAME">`)}<div class="grid g2" style="margin-top:12px;align-items:start">${multi('mobiles','Mobile no','Mobile number','addMobile','delMobile',1)}${multi('emails','Email ID','name@example.com','addEmail','delEmail',0)}</div><div style="margin-top:12px">${fld('Address',`<input type="text" data-m="address" value="${esc(m.address)}">`)}</div>`)}${sec(3,'Room categories & rates','Type each category once, then fill the plans this hotel offers',`<div class="lbl">Plan types shown in the table</div><div class="row" style="gap:8px">${plans}</div>${ap}<div style="height:14px"></div>${rooms}`)}${sec(4,'Add-on benefits','Flower bed, candle light dinner, cake, extra mattress …',adds)}${sec(5,'Facilities','Tick every facility this hotel has — it joins the matching lists',facs)}${sec(6,mode==='new'?'Submit to categories':'Save changes','Check where this hotel will appear',`<div id="sum">${summaryHTML(m,mode)}</div>${summaryBtns(m,mode)}`)}</div><div class="card sticky" id="chk">${checklistHTML(m,mode)}</div></div>`}

PAGES.update=()=>{const h=S.hotels.find(x=>x.id===UI.added);if(!h)return pageHead('Update All Hotels','Shows where your newly added hotel now appears','NEW ENTRY RESULT')+`<div class="card"><p>No new hotel has been submitted yet. Fill the <b>New Hotel Entry</b> page and press Submit — the hotel is added to every list at once and you will see the result here.</p><div style="margin-top:14px"><button class="btn" data-a="go" data-k="new">Go to New Hotel Entry</button></div></div>`;
 const isl=S.hotels.filter(x=>x.island===h.island),inCls=isl.filter(x=>x.tier===h.tier),rs=[...new Set(h.rooms.filter(r=>rowMin(r)<Infinity).map(r=>rangeOf(rowMin(r))))].sort(),fl=S.set.facilities.filter(f=>hasF(h,f.id)&&f.list),pos=(k)=>{const l=RK[k].auto(isl,999).findIndex(x=>x.id===h.id);return l<0?'—':'#'+(l+1)};
 const row=(ic,t,d,b)=>`<div class="li" style="align-items:flex-start"><span class="badge" style="background:var(--ok)">✓</span><div style="flex:1;min-width:0"><div class="hn">${t}</div><div class="mini">${d}</div></div>${b||''}</div>`;
 return pageHead('Update All Hotels','Your new hotel was saved and added to every list','SAVED ✓')+`<div class="alert ok"><span>✅</span><div><b>${esc(h.name)}</b> is now saved on <b>${esc(h.island)}</b> and shows on all pages. Everything below was updated automatically.</div></div><div class="grid gm" style="align-items:start"><div class="card"><h3 style="margin-bottom:4px">Where it appears now</h3>${row('','All Hotels page &amp; hotel dropdowns',`Hotel ${isl.length} of ${isl.length} on ${esc(h.island)}`,`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="hotels">View</button>`)}${row('','Dashboard counts',`${esc(h.island)}: ${isl.length} hotels · ${esc(h.tier||'no class')}: ${inCls.length}`,`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="home">View</button>`)}${row('','Find / Search','Searchable by name, price, plan, star and facility',`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="find">View</button>`)}${row('','Price Range',rs.length?rs.map(i=>rangeName(i)).join(' · '):'No prices entered',`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="range">View</button>`)}${row('','Star category',h.star?h.star+' STAR list':'No star chosen — not in a star list',`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="star">View</button>`)}${row('','Facility lists',fl.length?fl.map(f=>esc(f.name)).join(', '):'No list-page facility ticked',`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="fac">View</button>`)}${row('','Top rankings (Auto)',`Best hotels ${pos('best')} · Low price ${pos('low')} · Near ${esc(nearLabel(h.island).toLowerCase())} ${pos('near')}`,`<button class="btn ghost sm" data-a="viewIn" data-id="${h.id}" data-k="rank">View</button>`)}<p class="mini" style="margin-top:10px">Manual ranking lists are left as you set them — add this hotel from the Top Rankings page if you want it there.</p></div><div class="grid"><div class="card"><div class="lbl">New hotel</div><h2 style="font-size:1.2rem;margin-bottom:10px;overflow-wrap:anywhere">${esc(h.name)}</h2><table><tr><td>Island</td><td class="n">${esc(h.island)}</td></tr><tr><td>Class</td><td class="n">${tag(h.tier)}</td></tr><tr><td>Star</td><td class="n">${h.star?h.star+' ★':'—'}</td></tr><tr><td>Starting rate</td><td class="n">${inr(minRate(h))}</td></tr><tr><td>Plans used</td><td class="n">${S.set.plans.filter(p=>h.rooms.some(r=>r.p&&r.p[p.code])).map(p=>p.code).join(' · ')||'—'}</td></tr></table></div><div class="card"><button class="btn" style="width:100%;padding:14px" data-a="viewIn" data-id="${h.id}" data-k="detail">Open this hotel →</button><button class="btn ghost" style="width:100%;margin-top:10px" data-a="newAnother">＋ Add another hotel</button></div></div></div>`};

 addCls:()=>{const v=$('#newCls').value.trim();if(!v||S.set.classes.some(c=>c.name===v))return;S.set.classes.push({name:v,color:'#12b5cb'});save();render()},
 renCls:el=>{const i=+el.dataset.k,old=S.set.classes[i].name,v=el.value.trim();if(!v||S.set.classes.some((c,j)=>j!==i&&c.name===v)){render();return}S.hotels.forEach(h=>{if(h.tier===old)h.tier=v});if(UI.cls===old)UI.cls=v;S.set.classes[i].name=v;save();render()},
 delIsl:el=>{const i=S.set.islands[+el.dataset.k];if(S.hotels.some(h=>h.island===i.name)){toast('Move or delete that island\'s hotels first');return}S.set.islands.splice(+el.dataset.k,1);if(UI.island===i.name)UI.island=S.set.islands[0]?S.set.islands[0].name:'';save();render()},
 addIsl:()=>{const v=$('#newIsl').value.trim();if(!v||S.set.islands.some(c=>c.name===v))return;S.set.islands.push({name:v,near:'Jetty'});save();render()},
 renIsl:el=>{const i=+el.dataset.k,old=S.set.islands[i].name,v=el.value.trim();if(!v||S.set.islands.some((c,j)=>j!==i&&c.name===v)){render();return}S.hotels.forEach(h=>{if(h.island===old)h.island=v});if(UI.island===old)UI.island=v;S.set.islands[i].name=v;save();render()},
 delRange:el=>{if(S.set.ranges.length<2)return;S.set.ranges.splice(+el.dataset.k,1);save();render()},
 addRange:()=>{const l=S.set.ranges[S.set.ranges.length-1];S.set.ranges.push([l[1]+100,l[1]+5000]);save();render()},
 exportAll:()=>{openModal(`<h3>My backup</h3><p class="mini" style="margin:6px 0 10px">Copy all of this text and keep it in a note or file. To restore, paste it into “Restore from backup”.</p><textarea id="bk" rows="10" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-a="copyBk">📋 Copy</button><button class="btn ghost" data-a="closeModal">Close</button></div>`)},
 copyBk:()=>copyText($('#bk').value,'Backup copied'),
 importAsk:()=>openModal(`<h3>Restore from backup</h3><p class="mini" style="margin:6px 0 10px">Paste the backup text. This replaces what is saved here.</p><textarea id="bkIn" rows="8" placeholder="Paste backup text"></textarea><p id="bkErr" class="mini" style="color:var(--bad);margin-top:6px"></p><div class="row" style="margin-top:12px"><button class="btn" data-a="importDo">Restore</button><button class="btn ghost" data-a="closeModal">Cancel</button></div>`),
 importDo:()=>{try{const o=JSON.parse($('#bkIn').value);if(!o.hotels||!o.set)throw 0;S=norm(o);save();closeModal();applyTheme();UI.sel=null;toast('Backup restored');render()}catch(e){$('#bkErr').textContent='That does not look like a backup. Copy the whole text and try again.'}},
 resetAll:()=>{if(!UI.confirmReset){UI.confirmReset=true;render();return}S=fresh();save();UI.confirmReset=false;UI.sel=null;D=null;applyTheme();toast('Original data restored');render()},
 exportCsv:()=>{const pc=S.set.plans.map(p=>p.code),L=[['Island','Class','Hotel','Star','Mobile','Email','Address','Room category','Total rooms',...pc].join(',')],q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';S.hotels.forEach(h=>h.rooms.forEach(r=>L.push([h.island,h.tier,h.name,h.star||'',h.mobile,h.email,h.address,r.category,r.total==null?'':r.total,...pc.map(c=>r.p&&r.p[c]!=null?r.p[c]:'')].map(q).join(','))));openModal(`<h3>Hotels as CSV</h3><p class="mini" style="margin:6px 0 10px">Copy and paste into Excel or Google Sheets.</p><textarea id="csvTa" rows="10" readonly>${esc(L.join('\n'))}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-a="copyCsv">📋 Copy</button><button class="btn ghost" data-a="closeModal">Close</button></div>`)},
 copyCsv:()=>copyText($('#csvTa').value,'CSV copied'),
 setPin:()=>{const v=$('#pinNew').value.trim();if(!v){toast('Type a PIN first');return}S.set.pin=v;UI.unlocked=true;save();render();toast('PIN set')},
 clearPin:()=>{S.set.pin='';save();render();toast('PIN removed')},
 pinOk:()=>{const v=$('#pinIn').value;if(v===S.set.pin){UI.unlocked=true;closeModal();const f=UI.pending;UI.pending=null;if(f)f()}else $('#pinErr').textContent='Wrong PIN. Try again.'}
};
const EMO={Travel:'🏨 🏩 🏖️ 🏝️ 🌴 🌊 ⛴️ 🚤 ⛵ 🛶 🚗 🚕 🚌 ✈️ 🛫 🛬 🚁 🧳 🗺️ 🧭 ⛱️ 🏕️ ⛺ 🏔️ 🌋 🏞️ 🌅 🌄 🌇 🌃 🛎️ 🔑 🚪 🛏️ 🛋️ 🚿 🛁 🚽 🪑 🏠 🏡 🏢 🏛️ 🕌 🛕 🗼 🗽 🎡 🎢 🎠 🛣️ 🚏 🅿️ ⛽ 🚲 🛵',Food:'🍽️ 🍴 🥄 🍳 🥞 🧇 🥓 🍔 🍟 🍕 🌭 🥪 🌮 🌯 🥗 🍝 🍜 🍲 🍛 🍣 🍱 🥟 🍤 🍙 🍚 🍢 🍡 🍧 🍨 🍦 🍰 🎂 🧁 🍩 🍪 🍫 🍬 🍿 ☕ 🍵 🧃 🥤 🍷 🍸 🍹 🍺 🍻 🥂 🥃 🍾 🧊 🍎 🍌 🍉 🍍 🥥 🥭 🍇',Nature:'🌞 🌤️ ⛅ 🌈 🌙 ⭐ 🌟 ✨ 🔥 💧 🌸 🌺 🌻 🌷 🌹 🌿 🍃 🌱 🌳 🌲 🌵 🐚 🐠 🐟 🐬 🐳 🐢 🦀 🦜 🦋 🐘 🐒 🐕 🐈 🐾 🪸 🏄 🤿 🏊 🚣 🧜 ⛰️ 🏜️',Objects:'📶 📺 📱 💻 📞 🔌 💡 ❄️ 🌡️ 🔒 🔔 📷 🎥 🎵 🎶 🎤 🎮 🎲 🎯 🎳 🏋️ 🧘 💆 💇 🧖 🏌️ 🎾 🏸 🏓 ⚽ 🏏 🛒 💼 🧴 🧼 🪥 🧹 🧺 👶 ♿ 🛗 🚭 🧯 ⚡ 🔧 🧰 🛠️ 📦 🎁 🎈 🎉 🕯️',Faces:'😀 😃 😄 😁 😊 🙂 😍 🥰 😎 🤩 😇 🤗 😌 🙌 👍 👏 🙏 💪 👌 ✌️ 🤝 👋 ❤️ 🧡 💛 💚 💙 💜 💯 🎊',Symbols:'✔️ ✅ ❌ ➕ ➖ ⭐ ❤️ 🔹 🔸 🔶 🔷 🟢 🔴 🟡 🔵 ⚪ ⚫ ♨️ ♻️ ⚠️ ❗ ❓ 🆓 🆕 🆗 🔝 💲 💰 💳 🏷️ 📍 📌 🚩 🏁'};
function openEmoji(){const cats=Object.keys(EMO),cur=UI.emCat||cats[0];openModal(`<h3>Choose an emoji</h3><div style="margin:10px 0">${seg(cats.map(c=>[c,c]),cur,'emojiCat')}</div><div class="emgrid">${EMO[cur].split(' ').map(e=>`<button class="emb" data-a="emojiPick" data-e="${e}">${e}</button>`).join('')}</div><div class="row" style="margin-top:14px"><input id="emCustom" type="text" placeholder="…or type / paste your own" maxlength="8" style="flex:1;min-width:140px"><button class="btn sm" data-a="emojiCustom">Use</button><button class="btn ghost sm" data-a="closeModal">Cancel</button></div>`)}
function pickEmoji(e){const t=UI.emTarget||'';if(t==='new')UI.nfi=e;else if(t.startsWith('f:')){const f=S.set.facilities[+t.slice(2)];if(f)f.icon=e}save();closeModal();render()}
function openDD(c){const p=c.querySelector('.ddp'),inp=c.querySelector('input'),r=inp.getBoundingClientRect();p.hidden=false;const h=Math.min(240,p.scrollHeight+12),below=innerHeight-r.bottom;p.style.left=Math.max(8,r.left)+'px';p.style.width=Math.max(r.width,220)+'px';p.style.top=(below<h+12&&r.top>h+12?r.top-h-4:r.bottom+4)+'px'}
function closeDD(){document.querySelectorAll('.ddp').forEach(p=>p.hidden=true)}
function ddFilter(inp){const c=inp.closest('.combo'),q=inp.value.trim().toLowerCase();let n=0;c.querySelectorAll('.ddi').forEach(b=>{const ok=!q||b.dataset.v.toLowerCase().includes(q);b.hidden=!ok;if(ok)n++});if(n&&q)openDD(c);else c.querySelector('.ddp').hidden=true}
function processImg(f,size,cb){if(!/^image\//.test(f.type)){toast('Please choose an image file');return}const r=new FileReader();r.onerror=()=>toast('Could not read that file');r.onload=()=>{const im=new Image();im.onerror=()=>toast('That image could not be opened');im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);cb(c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)}
function focusLast(k){const l=document.querySelectorAll('[data-m^="'+k+'."]');if(l.length)l[l.length-1].focus()}
function addPlanFrom(pre){const code=($('#'+pre+'Code').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''),name=$('#'+pre+'Name').value.trim();if(!code||!name){toast('Enter a short code and a full name');return null}if(S.set.plans.some(p=>p.code===code)){toast(code+' already exists');return null}S.set.plans.push({code,name,meaning:$('#'+pre+'Mean').value.trim(),color:$('#'+pre+'Col').value,built:0,on:1});save();return code}
function applyDraft(h,d){h.island=d.island;h.tier=d.tier||'';h.star=d.star?+d.star:null;h.name=caseFmt(d.name,S.set.textCase.hotel);h.mobile=d.mobiles.map(x=>x.trim()).filter(Boolean).join(', ');h.email=d.emails.map(x=>x.trim()).filter(Boolean).join(', ');h.address=d.address.trim();h.fac=[...d.fac];h.addonLabel='ADD ON';
 h.rooms=d.rooms.filter(r=>r.category.trim()).map(r=>{const p={};Object.keys(r.p||{}).forEach(k=>{if(r.p[k]!=null&&r.p[k]!=='')p[k]=+r.p[k]});return{category:r.category.trim().toUpperCase(),total:toNum(r.total),p}});
 h.addons=d.addons.filter(a=>a.item.trim()).map(a=>({item:caseFmt(a.item,S.set.textCase.addon),rate:toNum(a.rate),note:''}))}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(!e.target.closest('.combo'))closeDD();
 const ov=e.target.closest('.ov');if(ov&&e.target===ov){closeModal();return}
 const t=e.target.closest('[data-a]');if(!t)return;const fn=A[t.dataset.a];if(fn){if(t.tagName==='A')e.preventDefault();fn(t,e)}});
function onField(e){const t=e.target;
 if(t.dataset.file){const f=t.files&&t.files[0];if(!f)return;if(t.dataset.file==='ferry'||t.dataset.file==='comp'){const L=S.set[t.dataset.file].find(x=>x.id===t.dataset.k);if(L)processImg(f,320,u=>{L.photo=u;save();render()})}else if(t.dataset.file==='logo')processImg(f,256,u=>{S.set.logo=u;save();render();toast('Logo updated')});else{const i=+t.dataset.k;processImg(f,160,u=>{S.set.company.team[i].photo=u;save();render()})}t.value='';return}
 if(t.dataset.upk){UI.pkgDur=t.value;render();return}
 if(t.dataset.upr){UI.pr[t.dataset.upr]=t.value;render();return}
 if(t.dataset.aChange&&e.type==='change'){const fn=A[t.dataset.aChange];if(fn){fn(t,e);return}if(t.dataset.aChange==='selH'){UI.sel=t.value;render();return}}
 if(t.dataset.m&&D){const p=t.dataset.m;let v=t.dataset.n?toNum(t.value):t.value;pset(D,p,v);if(t.dataset.dd&&e.type==='input')ddFilter(t);
  if(t.dataset.re&&e.type==='change'){render();return}refreshStatus();return}
 if(t.dataset.col){S.set.colors[t.dataset.col]=t.value;const hx=t.parentElement.querySelector('.hexv');if(hx)hx.textContent=t.value.toUpperCase();applyTheme();save();return}
 if(t.dataset.s){let v=t.dataset.n?toNum(t.value):t.value;if(t.dataset.n&&v==null&&t.type==='range')return;pset(S.set,t.dataset.s,v);save();if(t.dataset.pk)updPkgTotal();applyTheme();if(t.dataset.re&&e.type==='change')render();return}
 if(t.dataset.uf){UI.f[t.dataset.uf]=t.value;if(e.type==='input'||t.tagName==='SELECT')renderSoon();return}
 if(t.dataset.u){const k=t.dataset.u,v=t.value;if(k==='sugLow')UI.sug.low=+v;else if(k==='sugMid')UI.sug.mid=+v;else UI[k]=v;if(k==='sugLow'||k==='sugMid')return;if(e.type==='input'||t.tagName==='SELECT')renderSoon();return}}
document.addEventListener('input',e=>{if(e.target.dataset.col||e.target.dataset.pk||e.target.type==='range'||e.target.dataset.m||((e.target.dataset.u||e.target.dataset.uf)&&(e.target.type==='search'||e.target.type==='number')))onField(e)});
document.addEventListener('change',onField);
function reposDD(){const p=document.querySelector('.ddp:not([hidden])');if(!p)return;const c=p.closest('.combo'),r=c.querySelector('input').getBoundingClientRect();if(r.bottom<0||r.top>innerHeight){closeDD();return}openDD(c)}
window.addEventListener('scroll',reposDD,{passive:true});window.addEventListener('resize',reposDD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDD()}if(e.key==='Enter'&&e.target.id==='pinIn')A.pinOk()});
/* selects that pick a hotel */
document.addEventListener('change',e=>{const t=e.target;if(['dashSel','detSel','findSel'].includes(t.id)){UI.sel=t.value;render()}});

applyTheme();render();
</script>
