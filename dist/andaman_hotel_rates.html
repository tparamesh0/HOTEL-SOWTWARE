function mixW(hex,t){const n=parseInt(hex.slice(1),16),m=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return '#'+m(n>>16)+m((n>>8)&255)+m(n&255)}
function isDark(){const m=S.set.mode;if(m==='dark')return true;if(m==='light')return false;const t=document.documentElement.dataset.theme;if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){const c={...S.set.colors},r=document.documentElement.style,dk=isDark();
 if(dk){Object.assign(c,{bg:'#17181a',side:'#202124',card:'#25272a',text:'#e8eaed',soft:'#9aa0a6'});c.main=mixW(c.main,.35)}
 for(const k in c)r.setProperty('--'+k,c[k]);
 r.setProperty('--line',dk?'#3a3d41':'#e6e9ec');
 r.setProperty('--onmain',lum(c.main)>.42?'#202124':'#ffffff');r.setProperty('--onaccent',lum(c.accent)>.3?'#202124':'#ffffff');
 r.setProperty('--mainsoft',`color-mix(in srgb,${c.main} ${dk?22:12}%,${c.card})`);
 r.setProperty('--r',S.set.round+'px');r.setProperty('--fh',`'${S.set.font}',system-ui,sans-serif`);r.fontSize=(S.set.fs||15)+'px';
 r.colorScheme=dk?'dark':'light';
 document.body.classList.toggle('compact',!!S.set.compact);document.body.classList.toggle('noemoji',!S.set.emoji)}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme()});

 let rows=[...h.rooms].filter(r=>r.category);const so=opt.sort||'asc';
 if(so==='asc')rows.sort((a,b)=>rowMin(a)-rowMin(b));else if(so==='desc')rows.sort((a,b)=>rowMin(b)-rowMin(a));

 return `<div class="tw"><table><tr><th>ROOM CATEGORY</th>${cols.map(p=>`<th class="n" ${p.built?'':`style="color:${p.color}"`}>${esc(p.code)}</th>`).join('')}</tr>${rows.map(r=>`<tr><td class="hn">${esc(r.category)}</td>${cols.map(p=>r.p&&r.p[p.code]?`<td class="n">${inr(r.p[p.code])}</td>`:`<td class="na">—</td>`).join('')}</tr>`).join('')}</table></div>`}

const IDB=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('mm-docs',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('docs'))r.result.createObjectStore('docs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

function docPoster(cur,mode){UI.pqCtx={cur:String(cur),hid:UI.snapE?UI.snapE.id:null};const c=S.set.company,m=S.set.docMeta,P=PST(),pk=S.set.pkgPicks[cur]||{},np=pkP(cur),tot=docTotal(cur),days=Object.keys(pk).map(Number).filter(d=>d<=+cur+1).sort((a,b)=>a-b),dimg=[PIMG.d1,PIMG.d2,PIMG.d3,PIMG.d4,PIMG.d5],cols=Math.min(Math.max(days.length,1),5),hdr=['#1d4ed8','#16a34a'];

 <div class="row" style="justify-content:space-between;margin:22px 0 10px;gap:10px"><h3>👥 Customers <span class="mini">(${CL.length})</span></h3><div class="row" style="gap:8px"><input type="search" data-custq="1" value="${esc(UI.custQ||'')}" placeholder="Search customers…" aria-label="Search customers" style="max-width:220px">${ed?'':'<span class="mini">Saved automatically from tour packages</span>'}</div></div><div class="grid g4 cgrid">${cust||(ed?'':'<p class="mini">No customers yet — they are added automatically when you save a tour package with a customer name.</p>')}${ed?`<button class="card addc" data-a="custAdd"><span style="font-size:2rem;line-height:1">＋</span><span class="hn">Add customer</span></button>`:''}</div>${ed?'':'<p class="mini" style="margin-top:12px">To change the logo go to Settings → Name &amp; Logo.</p>'}`};

/* ---------- hotel form (new + edit) ---------- */
function newDraft(){return{island:UI.island,tier:'',star:'',name:'',mobiles:[''],emails:[''],address:UI.island,rooms:[{category:'',total:'',p:{}}],addons:[{item:'',rate:''}],addonLabel:'ADD ON',fac:[],plansOn:S.set.plans.filter(p=>p.on).map(p=>p.code)}}
const splitM=x=>{const a=String(x||'').split(/\s*[,;\/\n]\s*|\s+or\s+/i).map(v=>v.trim()).filter(Boolean);return a.length?a:['']};
const splitE=x=>{const a=String(x||'').split(/[,;\s]+/).map(v=>v.trim()).filter(Boolean);return a.length?a:['']};
const TT={upper:'uppercase',lower:'lowercase',title:'capitalize',asis:'none'};
function caseFmt(v,m){v=String(v==null?'':v).trim();if(m==='upper')return v.toUpperCase();if(m==='lower')return v.toLowerCase();if(m==='title')return v.toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,(x,a,b)=>a+b.toUpperCase());return v}
function draftFrom(h){const d=clone(h);d.mobiles=splitM(h.mobile);d.emails=splitE(h.email);d.star=h.star?String(h.star):'';d.tier=h.tier||'';d.total='';d.rooms=d.rooms.map(r=>({...r,total:r.total==null?'':r.total}));d.addons=d.addons.map(a=>({...a,rate:a.rate==null?'':a.rate}));if(!d.addons.length)d.addons=[{item:'',rate:''}];if(!d.rooms.length)d.rooms=[{category:'',total:'',p:{}}];d.plansOn=S.set.plans.filter(p=>d.rooms.some(r=>r.p&&r.p[p.code])||p.code==='CP').map(p=>p.code);return d}
function dupName(m,id){const n=m.name.trim().toUpperCase();return n&&S.hotels.some(h=>h.name.toUpperCase()===n&&h.island===m.island&&h.id!==id)}
function checks(m,mode){const nw=mode==='new',hasRoom=m.rooms.some(r=>r.category.trim()&&Object.values(r.p||{}).some(v=>v)),dup=dupName(m,m.id);
 const req=[['Island chosen',!!m.island]];if(nw)req.push(['Class chosen',!!m.tier]);req.push([dup?'Hotel name already exists on this island':'Hotel name',!!m.name.trim()&&!dup]);if(nw)req.push(['Mobile number',m.mobiles.some(x=>x.trim())],['1 room category with a price',hasRoom]);
 const opt=[];if(!nw)opt.push(['Class chosen',!!m.tier],['Mobile number',m.mobiles.some(x=>x.trim())],['Room with a price',hasRoom]);opt.push(['Email & address',m.emails.some(x=>x.trim())||!!m.address.trim()],['Add-on rates',m.addons.some(a=>a.item.trim())],['Facilities ticked',m.fac.length>0],['Star chosen',!!m.star]);
 return{req,opt}}
function validate(m,mode){const nw=mode==='new',E=[],add=(msg,f)=>E.push({msg,f});
 if(!m.island)add('Choose an island','island');
 if(nw&&!m.tier)add('Choose a class (High / Mid / Low)','tier');
 if(!m.name.trim())add('Type the hotel name','name');else if(dupName(m,m.id))add('A hotel named “'+m.name.trim().toUpperCase()+'” already exists on '+m.island+'. Change the name.','name');
 if(nw&&!m.mobiles.some(x=>x.trim()))add('Type at least one mobile number','mobiles.0');
 m.mobiles.forEach((v,i)=>{if(v.trim()&&!/\d{5}/.test(v))add('Mobile no '+(i+1)+' should have at least 5 digits','mobiles.'+i)});
 m.emails.forEach((v,i)=>{if(v.trim()&&!/^\S+@\S+\.\S+$/.test(v.trim()))add('Email '+(i+1)+' looks wrong — it should look like name@example.com','emails.'+i)});
 let any=false;const seen={};
 m.rooms.forEach((r,i)=>{const cat=r.category.trim().toUpperCase(),pr=Object.entries(r.p||{}).filter(([k,v])=>v!=null&&v!=='');
  if(!cat&&pr.length)add('Room row '+(i+1)+': type the room category (it has prices)','rooms.'+i+'.category');
  if(cat&&seen[cat])add('Room row '+(i+1)+': “'+cat+'” is already entered above. Use one row per category.','rooms.'+i+'.category');if(cat)seen[cat]=1;
  if(nw&&cat&&!pr.length)add('Room row '+(i+1)+' ('+cat+'): enter at least one price','rooms.'+i+'.p.'+(m.plansOn[0]||'CP'));
  pr.forEach(([k,v])=>{if(isNaN(+v)||+v<=0)add('Room row '+(i+1)+': the '+k+' price must be a number above 0','rooms.'+i+'.p.'+k)});
  if(cat&&pr.length)any=true});
 if(nw&&!any)add('Add at least one room category with a price','rooms.0.category');
 m.addons.forEach((a,i)=>{const it=a.item.trim(),has=a.rate!==''&&a.rate!=null;if(!it&&has)add('Add-on row '+(i+1)+': type the item name for the ₹'+a.rate+' rate','addons.'+i+'.item');if(it&&has&&(isNaN(+a.rate)||+a.rate<0))add('Add-on row '+(i+1)+' ('+it+'): the rate must be a number','addons.'+i+'.rate')});
 return E}
function errHTML(){const E=UI.errs;if(!E||!E.length)return '';return `<div class="alert bad" role="alert" style="align-items:flex-start"><span>⚠️</span><div style="flex:1"><b>Not saved yet — ${E.length} thing${E.length>1?'s':''} to fix</b><ul style="margin:6px 0 4px 18px">${E.map(e=>`<li>${esc(e.msg)}</li>`).join('')}</ul><div class="mini">The boxes marked in red below show where. Fix them and press the button again.</div></div></div>`}
function markErrs(){document.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));(UI.errs||[]).forEach(e=>{const el=document.querySelector('[data-m="'+e.f+'"]');if(el)el.classList.add('err')})}
function showErrs(E){UI.errs=E;render();const b=$('#errbox');if(b)b.scrollIntoView({block:'center'});const el=document.querySelector('[data-m="'+E[0].f+'"]');if(el)el.focus({preventScroll:true})}
function summaryHTML(m,mode){const c=checks(m,mode),ready=c.req.every(x=>x[1]);const rs=[...new Set(m.rooms.filter(r=>Object.values(r.p||{}).some(v=>v)).map(r=>rangeOf(rowMin(r))))].sort();const ch=a=>a.map(x=>`<span class="tag b" style="margin:2px 4px 2px 0">${esc(x)}</span>`).join('')||'<span class="mini">—</span>';

 return `<div class="grid sumgrid" style="grid-template-columns:130px minmax(0,1fr);row-gap:10px;font-size:.9rem;align-items:center"><b>Island</b><div>${ch([m.island])}</div><b>Class</b><div>${m.tier?tag(m.tier):'<span class="mini">not chosen</span>'}</div><b>Star list</b><div>${ch(m.star?[m.star+' STAR']:[])}</div><b>Price range</b><div>${ch(rs.map(rangeName))}</div><b>Facility lists</b><div>${ch(fl.filter(f=>f.list).map(f=>f.name))}</div><b>Other facilities</b><div>${ch(fl.filter(f=>!f.list).map(f=>f.name))}</div><b>Also updated</b><div>${ch(['Hotel dropdowns','All Hotels page','Dashboard counts','Low-price ranking'])}</div></div>`}
function summaryBtns(m,mode){return `<div class="row" style="margin-top:20px">${mode==='new'?`<button class="btn" id="submitBtn" data-a="submitNew">✅ Submit &amp; Update All Hotels</button><button class="btn red" data-a="clearForm">Clear form</button>`:`<button class="btn" id="submitBtn" data-a="saveEdit">💾 Save changes</button><button class="btn ghost" data-a="cancelEdit">Cancel</button><button class="btn red" data-a="delAsk">🗑 Delete hotel</button>`}</div>`}
function checklistHTML(m,mode){const c=checks(m,mode),done=c.req.filter(x=>x[1]).length,ready=done===c.req.length;const ln=([t,ok],o)=>`<div class="chk ${ok?'ok':''}"><span class="badge">${ok?'✓':''}</span><span class="t">${esc(t)}</span>${o?'<span class="mini">optional</span>':''}</div>`;
 return `<div class="row" style="justify-content:space-between"><h3>${ready?'✅':'📝'} Ready to ${mode==='new'?'submit':'save'}?</h3><span class="tag ${ready?'y':'w'}" style="white-space:nowrap">${done} of ${c.req.length} done</span></div><p class="mini" style="margin:8px 0 10px;line-height:1.5">A to-do list for this form. Each line turns <b style="color:var(--ok)">green</b> when you fill it. When all <b>required</b> lines are green you are ready. If you press ${mode==='new'?'Submit':'Save'} too early, it lists exactly what to fix. “Optional” lines can stay empty.</p><div class="lbl">Required</div>${c.req.map(x=>ln(x)).join('')}<div class="lbl" style="margin-top:10px">Optional</div>${c.opt.map(x=>ln(x,1)).join('')}<div class="alert ${ready?'ok':''}" style="margin:12px 0 0;padding:10px 14px;font-size:.85rem;font-weight:600;justify-content:center;text-align:center">${ready?'All required items done — you can '+(mode==='new'?'submit':'save'):'Still needed: '+c.req.filter(x=>!x[1]).map(x=>x[0].toLowerCase()).join(', ')}</div>`}
function refreshStatus(){const a=$('#chk'),b=$('#sum');if(!D)return;const mode=UI.page==='new'?'new':'edit';if(a)a.innerHTML=checklistHTML(D,mode);if(b)b.innerHTML=summaryHTML(D,mode);if(UI.errs){UI.errs=validate(D,mode);if(!UI.errs.length)UI.errs=null;const eb=$('#errbox');if(eb)eb.innerHTML=errHTML();markErrs()}}

 const plans=S.set.plans.map(p=>`<button class="planpill ${m.plansOn.includes(p.code)?'on':''}" style="--c:${p.color}" data-a="planOn" data-k="${esc(p.code)}">${m.plansOn.includes(p.code)?'✓ ':''}${esc(p.code)} <small>${esc(p.meaning||p.name)}</small></button>`).join('')+`<button class="planpill" style="--c:var(--main);border-style:dashed" data-a="togAddPlan">＋ Add plan type</button>`;
